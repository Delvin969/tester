<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Web</title>
<style>
  :root{
    --bg-app:#0b141a;
    --bg-sidebar:#111b21;
    --bg-header:#202c33;
    --bg-panel-hover:#2a3942;
    --bg-active:#2a3942;
    --bg-input:#2a3942;
    --accent:#00a884;
    --accent-dark:#008069;
    --border:#222d34;
    --text-main:#e9edef;
    --text-muted:#8696a0;
    --bubble-out:#005c4b;
    --bubble-in:#202c33;
    --online:#00d757;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0c1317;color:var(--text-main);-webkit-font-smoothing:antialiased;
  }
  #root{height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:#0c1317;}
  a{color:inherit;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#00a884 0%,#00a884 28%,#0c1317 28%,#0c1317 100%);
  }
  .login-card{
    background:#111b21;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.5);
    padding:44px 48px;width:420px;max-width:92vw;text-align:center;border:1px solid var(--border);
  }
  .login-logo{
    width:64px;height:64px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .login-logo svg{width:34px;height:34px;fill:#fff;}
  .login-card h1{font-size:22px;margin:0 0 6px;font-weight:600;color:var(--text-main);}
  .login-card p{color:var(--text-muted);font-size:14px;margin:0 0 24px;line-height:1.5;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1px solid #2a3942;border-radius:8px;
    font-size:15px;outline:none;transition:border-color .15s;background:#1f2c34;color:var(--text-main);
  }
  .field input::placeholder{color:#5f7178;}
  .field input:focus{border-color:var(--accent);}
  .login-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:filter .15s;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}
  .btn-primary{background:var(--accent);color:#062b23;flex:1;}
  .btn-secondary{background:#2a3942;color:var(--text-main);}
  .hint-row{margin-top:14px;font-size:13px;color:var(--text-muted);}
  .code-generated{
    font-family:"Courier New",monospace;font-size:20px;letter-spacing:3px;font-weight:700;
    background:#1f2c34;border-radius:8px;padding:10px;margin:10px 0 0;color:var(--online);
  }
  .err-msg{color:#ff6b6b;font-size:13px;margin-top:-6px;margin-bottom:12px;text-align:left;}
  .info-msg{color:var(--online);font-size:13px;margin-top:-6px;margin-bottom:12px;text-align:left;}
  .loading-line{font-size:13px;color:var(--text-muted);margin-top:14px;}
  .backend-note{font-size:11.5px;color:#5f7178;margin-top:18px;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  .app{width:100%;height:100%;display:flex;background:var(--bg-app);}
  .sidebar{width:400px;min-width:320px;max-width:40%;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-sidebar);}
  .sidebar-header{height:60px;background:var(--bg-header);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
  .avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;user-select:none;position:relative;}
  .avatar.sm{width:40px;height:40px;font-size:15px;}
  .avatar.md{width:49px;height:49px;font-size:17px;}
  .avatar.lg{width:72px;height:72px;font-size:24px;}
  .avatar.qm{background:#3a4a53;color:var(--text-muted);}
  .online-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--bg-sidebar);}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#aebac1;}
  .icon-btn:hover{background:#ffffff14;}
  .icon-btn svg{width:21px;height:21px;fill:currentColor;}
  .header-icons{display:flex;gap:2px;align-items:center;}

  .search-bar{padding:8px 12px;background:var(--bg-sidebar);flex-shrink:0;}
  .search-box{background:var(--bg-input);border-radius:8px;display:flex;align-items:center;padding:0 12px;height:36px;gap:8px;}
  .search-box svg{width:16px;height:16px;fill:#aebac1;flex-shrink:0;}
  .search-box input{border:none;background:transparent;outline:none;padding:0;font-size:14.5px;width:100%;color:var(--text-main);}
  .search-box input::placeholder{color:#8696a0;}

  .chat-list{flex:1;overflow-y:auto;}
  .chat-item{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #ffffff08;}
  .chat-item:hover{background:var(--bg-panel-hover);}
  .chat-item.active{background:var(--bg-active);}
  .chat-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .chat-item-top{display:flex;justify-content:space-between;align-items:baseline;}
  .chat-item-name{font-size:15px;font-weight:500;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-item-time{font-size:11.5px;color:var(--text-muted);flex-shrink:0;}
  .chat-item-preview{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty-list{padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13.5px;line-height:1.6;}
  .empty-list button{margin-top:14px;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-header{height:60px;background:var(--bg-header);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .chat-header-info{flex:1;min-width:0;cursor:default;}
  .chat-header-name{font-size:16px;font-weight:500;}
  .chat-header-sub{font-size:12.5px;color:var(--text-muted);}

  .messages{flex:1;overflow-y:auto;padding:20px 6%;background-color:#0b141a;
    background-image:radial-gradient(#ffffff05 1px, transparent 1px);background-size:22px 22px;
    display:flex;flex-direction:column;gap:2px;}
  .center-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);text-align:center;padding:20px;background:#0b141a;}
  .center-placeholder svg{width:150px;height:150px;opacity:.35;margin-bottom:22px;}
  .center-placeholder h2{font-weight:300;color:#dfe5e7;margin-bottom:10px;font-size:26px;}
  .my-code-banner{margin-top:22px;font-size:13px;background:#1f2c34;border-radius:8px;padding:10px 16px;}
  .my-code-banner b{color:var(--online);letter-spacing:1px;}

  .msg-row{display:flex;margin:2px 0;}
  .msg-row.out{justify-content:flex-end;}
  .bubble{max-width:65%;padding:6px 9px 8px 9px;border-radius:8px;position:relative;font-size:14.3px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.3);}
  .bubble.in{background:var(--bubble-in);border-top-left-radius:0;}
  .bubble.out{background:var(--bubble-out);border-top-right-radius:0;}
  .bubble .sender-tag{font-size:12.5px;font-weight:600;color:#6bd6c5;margin-bottom:2px;display:block;}
  .bubble .msg-text{white-space:pre-wrap;word-break:break-word;color:var(--text-main);}
  .bubble .msg-meta{display:flex;justify-content:flex-end;gap:4px;margin-top:2px;font-size:10.5px;color:#8696a0;align-items:center;}
  .day-divider{align-self:center;background:#182229;color:#8fa3ad;font-size:12px;padding:5px 12px;border-radius:8px;margin:10px 0;}

  .chat-input-bar{background:var(--bg-header);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .chat-input-bar input{flex:1;border:none;border-radius:20px;padding:11px 16px;font-size:14.5px;outline:none;background:var(--bg-input);color:var(--text-main);}
  .chat-input-bar input::placeholder{color:#8696a0;}
  .chat-input-bar input:disabled{opacity:.6;cursor:not-allowed;}
  .send-btn{background:transparent;border:none;cursor:pointer;color:#aebac1;display:flex;}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}
  .send-btn svg{width:24px;height:24px;fill:currentColor;}

  /* ---------- MODALS ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#111b21;border-radius:10px;width:420px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
  .modal-header{background:var(--bg-header);color:#fff;padding:18px 20px;font-size:17px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
  .modal-header button{background:none;border:none;color:#fff;cursor:pointer;}
  .modal-header svg{width:20px;height:20px;fill:#fff;}
  .modal-body{padding:20px;overflow-y:auto;}
  .modal-footer{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);}
  .contact-pick-row{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;border-radius:6px;}
  .contact-pick-row:hover{background:var(--bg-panel-hover);}
  .contact-pick-row input{width:18px;height:18px;accent-color:var(--accent);}
  .muted-note{font-size:12.5px;color:var(--text-muted);margin-top:6px;}
  .copy-row{display:flex;gap:8px;align-items:center;}
  .copy-row .code-generated{flex:1;margin:0;text-align:center;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#233138;color:#e9edef;
    padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:100;
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#2a3942;border-radius:4px;}

  @media (max-width:820px){
    .sidebar{width:100%;max-width:none;}
    .main{display:none;}
    .app.chat-open .sidebar{display:none;}
    .app.chat-open .main{display:flex;}
    .back-btn{display:flex !important;}
  }
  .back-btn{display:none;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PFX = "waclone_v2_";
  var POLL_MS = 3000;
  var ONLINE_WINDOW_MS = 10000;

  /* ============== ICONS ============== */
  var ICONS = {
    logo:'<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.05c-1.48 0-2.93-.4-4.19-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.02 8.02 0 0 1-1.23-4.28c0-4.44 3.62-8.05 8.05-8.05a8 8 0 0 1 8.04 8.05c0 4.44-3.61 8.14-7.9 8.14z"/></svg>',
    search:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>',
    key:'<svg viewBox="0 0 24 24"><path d="M12.65 10A5.5 5.5 0 1 0 12.65 14H16v3h3v-3h2v-4zM7.5 12A1.5 1.5 0 1 1 9 10.5 1.5 1.5 0 0 1 7.5 12z"/></svg>',
    newchat:'<svg viewBox="0 0 24 24"><path d="M17.5 3H6.5A2.5 2.5 0 0 0 4 5.5v13.75a.75.75 0 0 0 1.2.6l3.4-2.6h8.9a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 17.5 3zM13 11h-2v2H9.5v-2h-2V9.5h2v-2H11v2h2V11z"/></svg>',
    group:'<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C16.19 13.87 17 15.1 17 16.5V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>',
    dots:'<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>',
    send:'<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>',
    close:'<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
    check1:'<svg viewBox="0 0 18 18" width="14" height="14"><path fill="#8696a0" d="M6.6 12.1 3.5 9l-1 1 4.1 4.1 8-8-1-1z"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
    video:'<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>',
    phone:'<svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.1 15.1 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/></svg>',
    emoji:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-10 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 7c-2.5 0-4.6-1.5-5.5-3.6h11c-.9 2.1-3 3.6-5.5 3.6z"/></svg>',
    attach:'<svg viewBox="0 0 24 24"><path d="M16.5 6v10.5a4 4 0 1 1-8 0V5a2.5 2.5 0 1 1 5 0v10a1 1 0 1 1-2 0V6h-1.5v9a2.5 2.5 0 1 0 5 0V5a4 4 0 1 0-8 0v11.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg>'
  };

  var AVATAR_COLORS = ["#7c4dff","#ff9800","#e91e63","#00a884","#3f9fdb","#ab47bc","#ff7043","#26a69a","#5c6bc0"];
  function colorFor(key){
    var h = 0;
    for(var i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* ============== TOAST ============== */
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  /* ============== STORAGE ADAPTER ============== */
  // Prefers window.storage (available inside Claude.ai artifacts). If that API
  // is missing or fails (e.g. this file is hosted standalone on GitHub Pages),
  // it falls back to the browser's localStorage so the app still works —
  // but then contacts/messages only persist on THIS device/browser, since
  // there is no shared server to sync across devices in that mode.
  var backend = null; // 'claude' | 'local'

  async function detectBackend(){
    if(window.storage && typeof window.storage.set === "function" && typeof window.storage.get === "function"){
      try{
        var testKey = PFX+"__probe__";
        await window.storage.set(testKey, "1", true);
        var r = await window.storage.get(testKey, true);
        if(r && r.value === "1"){ backend = "claude"; return; }
      }catch(e){ /* fall through to local */ }
    }
    backend = "local";
  }

  async function storeGet(key){
    try{
      if(backend === "claude"){
        var r = await window.storage.get(key, true);
        return r ? JSON.parse(r.value) : null;
      } else {
        var v = window.localStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      }
    }catch(e){ return null; }
  }
  async function storeSet(key, val){
    try{
      if(backend === "claude"){
        await window.storage.set(key, JSON.stringify(val), true);
      } else {
        window.localStorage.setItem(key, JSON.stringify(val));
      }
      return true;
    }catch(e){ return false; }
  }

  function kUser(code){ return PFX+"user_"+code; }
  function kContacts(code){ return PFX+"contacts_"+code; }
  function kUserGroups(code){ return PFX+"usergroups_"+code; }
  function kGroup(id){ return PFX+"group_"+id; }
  function kChat(id){ return PFX+"chat_"+id; }
  function kPresence(code){ return PFX+"presence_"+code; }
  function dmId(a,b){ return "dm_"+[a,b].sort().join("__"); }

  function randCode(len){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var out = "";
    for(var i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function normCode(c){ return (c||"").trim().toUpperCase().replace(/\s+/g,""); }
  function initials(name){
    if(!name) return "?";
    var parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtTime(ts){
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?"0"+h:h)+":"+(m<10?"0"+m:m);
  }
  function fmtDay(ts){
    var d = new Date(ts);
    var today = new Date();
    var y = new Date(); y.setDate(today.getDate()-1);
    if(d.toDateString()===today.toDateString()) return "Hari ini";
    if(d.toDateString()===y.toDateString()) return "Kemarin";
    return d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  }

  /* ============== APP STATE ============== */
  var state = {
    screen: "boot",        // boot | login | app
    myCode: null,
    myName: null,
    contacts: [],
    groupIds: [],
    groups: {},
    lastMsgMap: {},         // chatItemId -> {text, ts, from}
    presenceMap: {},        // code -> ts
    activeChat: null,
    messages: [],
    modal: null,
    loginBusy: false,
    loginError: "",
    loginInfo: "",
    pollHandle: null
  };

  var root = document.getElementById("root");

  /* ============== RENDER ============== */
  function render(){
    if(state.screen === "boot"){
      root.innerHTML = '<div class="login-wrap"><div class="login-card"><div class="loading-line">Menyiapkan aplikasi&hellip;</div></div></div>';
      return;
    }
    if(state.screen === "login"){ renderLogin(); return; }
    renderApp();
  }

  function renderLogin(){
    root.innerHTML =
    '<div class="login-wrap"><div class="login-card">'+
      '<div class="login-logo">'+ICONS.logo+'</div>'+
      '<h1>WhatsApp Web</h1>'+
      '<p>Masuk pakai kode. Kode baru dibuatkan otomatis kalau belum pernah dipakai &mdash; kalau kode sudah ada, kamu masuk ke akun yang sama.</p>'+
      '<div class="field">'+
        '<label>Nama tampilan</label>'+
        '<input id="in-name" type="text" placeholder="Misal: Rani" maxlength="30" value="'+escapeHtml(state.tmpName||"")+'"/>'+
      '</div>'+
      '<div class="field">'+
        '<label>Kode masuk</label>'+
        '<input id="in-code" type="text" placeholder="Kosongkan untuk buat kode baru" maxlength="12" style="text-transform:uppercase;letter-spacing:2px" value="'+escapeHtml(state.tmpCode||"")+'"/>'+
      '</div>'+
      (state.loginError ? '<div class="err-msg">'+escapeHtml(state.loginError)+'</div>' : '')+
      (state.loginInfo ? '<div class="info-msg">'+escapeHtml(state.loginInfo)+'</div>' : '')+
      '<div class="login-actions">'+
        '<button class="btn btn-secondary" id="btn-random" '+(state.loginBusy?'disabled':'')+'>Buatkan Kode</button>'+
        '<button class="btn btn-primary" id="btn-login" '+(state.loginBusy?'disabled':'')+'>Masuk</button>'+
      '</div>'+
      (state.loginBusy ? '<div class="loading-line">Menghubungkan&hellip;</div>' : '')+
      (backend === "local" ? '<div class="backend-note">Mode lokal aktif: kontak, grup, dan pesan hanya tersimpan di browser ini (tidak sinkron ke perangkat lain). Ini biasanya terjadi saat halaman dibuka di luar Claude.ai, misalnya lewat GitHub Pages.</div>' : '')+
    '</div></div>';

    document.getElementById("btn-random").onclick = onGenerateCode;
    document.getElementById("btn-login").onclick = onLogin;
    document.getElementById("in-name").oninput = function(e){ state.tmpName = e.target.value; };
    document.getElementById("in-code").oninput = function(e){ state.tmpCode = e.target.value; };
    document.getElementById("in-code").onkeydown = function(e){ if(e.key==="Enter") onLogin(); };
    document.getElementById("in-name").onkeydown = function(e){ if(e.key==="Enter") onLogin(); };
  }

  async function onGenerateCode(){
    state.loginError = ""; state.loginInfo = "";
    var name = (state.tmpName||"").trim();
    if(!name){ state.loginError = "Isi nama tampilan dulu, ya."; render(); return; }
    state.loginBusy = true; render();
    var code = randCode(6);
    var existing = await storeGet(kUser(code));
    var tries = 0;
    while(existing && tries<5){ code = randCode(6); existing = await storeGet(kUser(code)); tries++; }
    var ok = await storeSet(kUser(code), {code:code, name:name, createdAt:Date.now()});
    state.loginBusy = false;
    if(!ok){ state.loginError = "Gagal membuat kode. Coba lagi."; render(); return; }
    state.tmpCode = code;
    state.loginInfo = "Kode kamu: "+code+" — catat kodenya, lalu tekan Masuk.";
    render();
  }

  async function onLogin(){
    state.loginError = ""; state.loginInfo = "";
    var code = normCode(state.tmpCode);
    var name = (state.tmpName||"").trim();
    if(!code){ state.loginError = "Masukkan kode, atau klik \"Buatkan Kode\"."; render(); return; }
    if(!name){ state.loginError = "Isi nama tampilan dulu, ya."; render(); return; }
    state.loginBusy = true; render();
    var existing = await storeGet(kUser(code));
    if(existing){
      state.myCode = code;
      state.myName = existing.name;
    } else {
      var ok = await storeSet(kUser(code), {code:code, name:name, createdAt:Date.now()});
      if(!ok){ state.loginBusy=false; state.loginError="Gagal menyimpan akun. Coba lagi."; render(); return; }
      state.myCode = code;
      state.myName = name;
    }
    await storeSet(kPresence(state.myCode), Date.now());
    await loadUserData();
    state.loginBusy = false;
    state.screen = "app";
    render();
    startPolling();
  }

  async function loadUserData(){
    var contacts = await storeGet(kContacts(state.myCode));
    state.contacts = contacts || [];
    var groupIds = await storeGet(kUserGroups(state.myCode));
    state.groupIds = groupIds || [];
    state.groups = {};
    for(var i=0;i<state.groupIds.length;i++){
      var g = await storeGet(kGroup(state.groupIds[i]));
      if(g) state.groups[g.id] = g;
    }
    // presence for contacts
    var pMap = {};
    for(var j=0;j<state.contacts.length;j++){
      var p = await storeGet(kPresence(state.contacts[j].code));
      if(p) pMap[state.contacts[j].code] = p;
    }
    state.presenceMap = pMap;
    // last message preview per chat item
    var items = buildChatListItems();
    var lm = {};
    for(var k=0;k<items.length;k++){
      var arr = await storeGet(kChat(items[k].id));
      if(arr && arr.length){ lm[items[k].id] = arr[arr.length-1]; }
    }
    state.lastMsgMap = lm;
  }

  function startPolling(){
    if(state.pollHandle) clearInterval(state.pollHandle);
    state.pollHandle = setInterval(async function(){
      if(state.screen!=="app") return;
      await storeSet(kPresence(state.myCode), Date.now());
      await loadUserData();
      if(state.activeChat){
        await refreshMessages();
      }
      render();
    }, POLL_MS);
  }

  /* ---------- App shell ---------- */
  function renderApp(){
    var appClass = "app" + (state.activeChat ? " chat-open" : "");
    root.innerHTML = '<div class="'+appClass+'" id="app-el"></div>';
    var appEl = document.getElementById("app-el");
    appEl.appendChild(buildSidebar());
    appEl.appendChild(buildMain());
    if(state.modal) appEl.appendChild(buildModal());
  }

  function buildSidebar(){
    var el = document.createElement("div");
    el.className = "sidebar";

    var header = document.createElement("div");
    header.className = "sidebar-header";
    header.innerHTML =
      '<div class="avatar sm" style="background:'+colorFor(state.myCode)+'" title="'+escapeHtml(state.myName)+'">'+initials(state.myName)+'</div>'+
      '<div class="header-icons">'+
        '<button class="icon-btn" id="ic-newchat" title="Tambah kontak">'+ICONS.newchat+'</button>'+
        '<button class="icon-btn" id="ic-group" title="Buat grup">'+ICONS.group+'</button>'+
        '<button class="icon-btn" id="ic-profile" title="Kode saya">'+ICONS.dots+'</button>'+
      '</div>';
    el.appendChild(header);

    var search = document.createElement("div");
    search.className = "search-bar";
    search.innerHTML = '<div class="search-box">'+ICONS.search+'<input id="chat-search" placeholder="Cari nama atau kode..."/>'+ICONS.key+'</div>';
    el.appendChild(search);

    var list = document.createElement("div");
    list.className = "chat-list";
    var items = buildChatListItems();
    items.sort(function(a,b){
      var ta = (state.lastMsgMap[a.id]||{}).ts || 0;
      var tb = (state.lastMsgMap[b.id]||{}).ts || 0;
      return tb - ta;
    });
    var q = (state.searchQuery||"").toLowerCase();
    if(q) items = items.filter(function(it){
      return it.title.toLowerCase().indexOf(q) !== -1 || (it.code && it.code.toLowerCase().indexOf(q) !== -1);
    });

    if(items.length === 0){
      list.innerHTML = '<div class="empty-list">Belum ada obrolan.<br/>Tambahkan kontak pakai kode teman kamu, atau buat grup.<br/><button class="btn btn-primary" id="empty-add-contact">Tambah Kontak</button></div>';
    } else {
      items.forEach(function(it){
        var last = state.lastMsgMap[it.id];
        var preview = last ? ((last.from===state.myCode?"Kamu: ":"")+last.text) : "Mulai chat";
        var isOnline = it.code && state.presenceMap[it.code] && (Date.now()-state.presenceMap[it.code] < ONLINE_WINDOW_MS);
        var row = document.createElement("div");
        row.className = "chat-item" + (state.activeChat && state.activeChat.id===it.id ? " active" : "");
        row.innerHTML =
          '<div class="avatar md" style="background:'+colorFor(it.code||it.groupId)+'">'+initials(it.title)+(isOnline?'<span class="online-dot"></span>':'')+'</div>'+
          '<div class="chat-item-body">'+
            '<div class="chat-item-top"><span class="chat-item-name">'+escapeHtml(it.title)+'</span>'+
              (last ? '<span class="chat-item-time">'+fmtTime(last.ts)+'</span>' : '')+
            '</div>'+
            '<div class="chat-item-preview">'+escapeHtml(preview)+'</div>'+
          '</div>';
        row.onclick = function(){ openChat(it); };
        list.appendChild(row);
      });
    }
    el.appendChild(list);

    setTimeout(function(){
      var s = document.getElementById("chat-search");
      if(s) s.oninput = function(e){ state.searchQuery = e.target.value; renderApp(); };
      var nc = document.getElementById("ic-newchat"); if(nc) nc.onclick = function(){ openModal("addContact"); };
      var ng = document.getElementById("ic-group"); if(ng) ng.onclick = function(){ openModal("newGroup"); };
      var pf = document.getElementById("ic-profile"); if(pf) pf.onclick = function(){ openModal("profile"); };
      var eac = document.getElementById("empty-add-contact"); if(eac) eac.onclick = function(){ openModal("addContact"); };
    },0);

    return el;
  }

  function buildChatListItems(){
    var items = [];
    state.contacts.forEach(function(c){
      items.push({type:"dm", id:dmId(state.myCode,c.code), title:c.name, sub:"#"+c.code, code:c.code});
    });
    state.groupIds.forEach(function(id){
      var g = state.groups[id];
      if(g){
        items.push({type:"group", id:"grp_"+g.id, title:g.name, sub:g.members.length+" anggota", groupId:g.id});
      }
    });
    return items;
  }

  function openChat(it){
    state.activeChat = it;
    state.messages = [];
    renderApp();
    refreshMessages().then(renderApp);
  }

  async function refreshMessages(){
    if(!state.activeChat) return;
    var msgs = await storeGet(kChat(state.activeChat.id));
    state.messages = msgs || [];
  }

  function buildMain(){
    var el = document.createElement("div");
    el.className = "main";

    var header = document.createElement("div");
    header.className = "chat-header";
    if(state.activeChat){
      header.innerHTML =
        '<button class="icon-btn back-btn" id="btn-back">&#8592;</button>'+
        '<div class="avatar sm" style="background:'+colorFor(state.activeChat.code||state.activeChat.groupId)+'">'+initials(state.activeChat.title)+'</div>'+
        '<div class="chat-header-info">'+
          '<div class="chat-header-name">'+escapeHtml(state.activeChat.title)+'</div>'+
          '<div class="chat-header-sub">'+escapeHtml(state.activeChat.sub||"")+'</div>'+
        '</div>'+
        '<div class="header-icons">'+
          '<button class="icon-btn" id="hd-video" title="Panggilan video">'+ICONS.video+'</button>'+
          '<button class="icon-btn" id="hd-phone" title="Panggilan suara">'+ICONS.phone+'</button>'+
          '<button class="icon-btn" id="hd-dots" title="Menu">'+ICONS.dots+'</button>'+
        '</div>';
    } else {
      header.innerHTML =
        '<div class="avatar sm qm">?</div>'+
        '<div class="chat-header-info">'+
          '<div class="chat-header-name">Pilih kontak</div>'+
          '<div class="chat-header-sub">Klik untuk memulai chat</div>'+
        '</div>'+
        '<div class="header-icons">'+
          '<button class="icon-btn" id="hd-mail" title="Pesan">'+ICONS.mail+'</button>'+
          '<button class="icon-btn" id="hd-video" title="Panggilan video">'+ICONS.video+'</button>'+
          '<button class="icon-btn" id="hd-phone" title="Panggilan suara">'+ICONS.phone+'</button>'+
          '<button class="icon-btn" id="hd-dots" title="Menu">'+ICONS.dots+'</button>'+
        '</div>';
    }
    el.appendChild(header);

    if(!state.activeChat){
      var ph = document.createElement("div");
      ph.className = "center-placeholder";
      ph.innerHTML =
        ICONS.logo.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="150" height="150"')+
        '<h2>WhatsApp Web</h2>'+
        '<div>Pilih kontak atau grup di sebelah kiri untuk mulai mengirim pesan.</div>'+
        '<div class="my-code-banner">Kode kamu: <b>'+escapeHtml(state.myCode)+'</b> — bagikan supaya teman bisa menambahkanmu.</div>';
      el.appendChild(ph);
    } else {
      var msgsEl = document.createElement("div");
      msgsEl.className = "messages";
      msgsEl.id = "messages-box";
      var lastDay = null;
      state.messages.forEach(function(m){
        var day = fmtDay(m.ts);
        if(day !== lastDay){
          var div = document.createElement("div");
          div.className = "day-divider";
          div.textContent = day;
          msgsEl.appendChild(div);
          lastDay = day;
        }
        var isOut = m.from === state.myCode;
        var row = document.createElement("div");
        row.className = "msg-row " + (isOut?"out":"in");
        var senderName = (state.activeChat.type==="group" && !isOut) ? (m.fromName || m.from) : "";
        row.innerHTML =
          '<div class="bubble '+(isOut?"out":"in")+'">'+
            (senderName ? '<span class="sender-tag">'+escapeHtml(senderName)+'</span>' : '')+
            '<span class="msg-text">'+escapeHtml(m.text)+'</span>'+
            '<div class="msg-meta">'+fmtTime(m.ts)+ (isOut? ' '+ICONS.check1 : '')+'</div>'+
          '</div>';
        msgsEl.appendChild(row);
      });
      el.appendChild(msgsEl);
    }

    var inputBar = document.createElement("div");
    inputBar.className = "chat-input-bar";
    var disabled = state.activeChat ? "" : "disabled";
    inputBar.innerHTML =
      '<button class="icon-btn" id="btn-emoji" '+disabled+'>'+ICONS.emoji+'</button>'+
      '<button class="icon-btn" id="btn-attach" '+disabled+'>'+ICONS.attach+'</button>'+
      '<input id="msg-input" type="text" placeholder="'+(state.activeChat?'Ketik pesan':'Pilih kontak atau grup')+'" '+disabled+'/>'+
      '<button class="send-btn" id="btn-send" title="Kirim" '+disabled+'>'+ICONS.send+'</button>';
    el.appendChild(inputBar);

    setTimeout(function(){
      var box = document.getElementById("messages-box");
      if(box) box.scrollTop = box.scrollHeight;
      var back = document.getElementById("btn-back");
      if(back) back.onclick = function(){ state.activeChat = null; renderApp(); };
      ["hd-mail","hd-video","hd-phone","hd-dots","btn-emoji","btn-attach"].forEach(function(id){
        var e = document.getElementById(id);
        if(e) e.onclick = function(){ toast("Fitur ini belum tersedia di versi ini."); };
      });
      if(state.activeChat){
        var input = document.getElementById("msg-input");
        var sendBtn = document.getElementById("btn-send");
        function doSend(){
          var txt = input.value.trim();
          if(!txt) return;
          input.value = "";
          sendMessage(txt);
        }
        input.onkeydown = function(e){ if(e.key==="Enter") doSend(); };
        sendBtn.onclick = doSend;
        input.focus();
      }
    },0);

    return el;
  }

  async function sendMessage(text){
    var chat = state.activeChat;
    var msg = {from:state.myCode, fromName:state.myName, text:text, ts:Date.now()};
    state.messages.push(msg);
    renderApp();
    var existing = await storeGet(kChat(chat.id));
    var arr = existing || [];
    arr.push(msg);
    await storeSet(kChat(chat.id), arr);
    refreshMessages().then(renderApp);
  }

  /* ---------- Modals ---------- */
  function openModal(name){
    state.modal = name;
    state.modalError = "";
    state.pickCode = "";
    state.groupNameInput = "";
    state.groupPicked = {};
    renderApp();
  }
  function closeModal(){ state.modal = null; renderApp(); }

  function buildModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.onclick = function(e){ if(e.target===overlay) closeModal(); };

    var modal = document.createElement("div");
    modal.className = "modal";

    if(state.modal === "addContact"){
      modal.innerHTML =
        '<div class="modal-header"><span>Tambah Kontak</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>Kode kontak</label>'+
            '<input id="add-code" type="text" placeholder="Masukkan kode teman" style="text-transform:uppercase" value="'+escapeHtml(state.pickCode)+'"/></div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<div class="muted-note">Minta kode masuk temanmu, lalu masukkan di sini. Setelah ditambahkan, obrolan langsung muncul untuk kalian berdua.</div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save">Tambah</button></div>';
    } else if(state.modal === "newGroup"){
      var rows = state.contacts.map(function(c){
        var checked = state.groupPicked[c.code] ? "checked" : "";
        return '<label class="contact-pick-row"><input type="checkbox" data-code="'+escapeHtml(c.code)+'" class="grp-pick" '+checked+'/>'+
          '<div class="avatar sm" style="background:'+colorFor(c.code)+'">'+initials(c.name)+'</div><div>'+escapeHtml(c.name)+' <span style="color:#8696a0;font-size:12px">#'+escapeHtml(c.code)+'</span></div></label>';
      }).join("");
      modal.innerHTML =
        '<div class="modal-header"><span>Grup Baru</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>Nama grup</label><input id="grp-name" type="text" placeholder="Misal: Tim Proyek" value="'+escapeHtml(state.groupNameInput)+'"/></div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<label style="font-size:12.5px;color:var(--text-muted);display:block;margin:14px 0 4px;">Pilih anggota</label>'+
          (state.contacts.length ? rows : '<div class="muted-note">Tambahkan kontak dulu sebelum membuat grup.</div>')+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save">Buat Grup</button></div>';
    } else if(state.modal === "profile"){
      modal.innerHTML =
        '<div class="modal-header"><span>Profil Saya</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body" style="text-align:center;">'+
          '<div class="avatar lg" style="margin:0 auto 14px;background:'+colorFor(state.myCode)+'">'+initials(state.myName)+'</div>'+
          '<div style="font-size:17px;font-weight:600;margin-bottom:4px;">'+escapeHtml(state.myName)+'</div>'+
          '<div class="muted-note" style="margin-bottom:14px;">Ini kode masuk kamu. Bagikan ke orang lain supaya mereka bisa menambahkanmu sebagai kontak.</div>'+
          '<div class="copy-row"><div class="code-generated">'+escapeHtml(state.myCode)+'</div><button class="btn btn-secondary" id="m-copy">Salin</button></div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-primary" id="m-cancel">Tutup</button></div>';
    }

    overlay.appendChild(modal);

    setTimeout(function(){
      var close = document.getElementById("m-close"); if(close) close.onclick = closeModal;
      var cancel = document.getElementById("m-cancel"); if(cancel) cancel.onclick = closeModal;

      if(state.modal === "addContact"){
        var input = document.getElementById("add-code");
        input.oninput = function(e){ state.pickCode = e.target.value; };
        input.onkeydown = function(e){ if(e.key==="Enter") saveAddContact(); };
        document.getElementById("m-save").onclick = saveAddContact;
        input.focus();
      } else if(state.modal === "newGroup"){
        var nameInput = document.getElementById("grp-name");
        if(nameInput) nameInput.oninput = function(e){ state.groupNameInput = e.target.value; };
        document.querySelectorAll(".grp-pick").forEach(function(cb){
          cb.onchange = function(e){ state.groupPicked[e.target.getAttribute("data-code")] = e.target.checked; };
        });
        document.getElementById("m-save").onclick = saveNewGroup;
      } else if(state.modal === "profile"){
        var copyBtn = document.getElementById("m-copy");
        if(copyBtn) copyBtn.onclick = function(){
          try{
            navigator.clipboard.writeText(state.myCode);
            copyBtn.textContent = "Tersalin!";
            setTimeout(function(){ copyBtn.textContent = "Salin"; },1500);
          }catch(e){ toast("Tidak bisa menyalin otomatis, salin manual ya."); }
        };
      }
    },0);

    return overlay;
  }

  async function saveAddContact(){
    var code = normCode(state.pickCode);
    if(!code){ state.modalError = "Masukkan kode terlebih dulu."; renderApp(); return; }
    if(code === state.myCode){ state.modalError = "Tidak bisa menambahkan kode sendiri."; renderApp(); return; }
    if(state.contacts.some(function(c){return c.code===code;})){ state.modalError = "Kontak ini sudah ada."; renderApp(); return; }
    state.modalError = "Mencari kode...";
    renderApp();
    var target = await storeGet(kUser(code));
    if(!target){
      state.modalError = backend==="local"
        ? "Kode tidak ditemukan di penyimpanan lokal ini. Di mode lokal, kode hanya dikenali di browser yang sama."
        : "Kode tidak ditemukan. Pastikan kode benar.";
      renderApp(); return;
    }

    var myContacts = (await storeGet(kContacts(state.myCode))) || [];
    if(!myContacts.some(function(c){return c.code===code;})){
      myContacts.push({code:code, name:target.name});
      await storeSet(kContacts(state.myCode), myContacts);
    }
    var theirContacts = (await storeGet(kContacts(code))) || [];
    if(!theirContacts.some(function(c){return c.code===state.myCode;})){
      theirContacts.push({code:state.myCode, name:state.myName});
      await storeSet(kContacts(code), theirContacts);
    }

    await loadUserData();
    closeModal();
  }

  async function saveNewGroup(){
    var name = (state.groupNameInput||"").trim();
    var picked = Object.keys(state.groupPicked).filter(function(c){return state.groupPicked[c];});
    if(!name){ state.modalError = "Beri nama grupnya dulu."; renderApp(); return; }
    if(picked.length < 1){ state.modalError = "Pilih minimal satu anggota."; renderApp(); return; }
    state.modalError = "";
    var id = randCode(8);
    var members = picked.slice();
    members.push(state.myCode);
    var group = {id:id, name:name, members:members, createdBy:state.myCode, createdAt:Date.now()};
    await storeSet(kGroup(id), group);
    for(var i=0;i<members.length;i++){
      var mCode = members[i];
      var ug = (await storeGet(kUserGroups(mCode))) || [];
      if(ug.indexOf(id)===-1){ ug.push(id); await storeSet(kUserGroups(mCode), ug); }
    }
    await loadUserData();
    closeModal();
  }

  /* ============== BOOT ============== */
  render();
  detectBackend().then(function(){
    state.screen = "login";
    render();
  });
})();
</script>
</body>
</html>
