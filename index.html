<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web — Chat & Grup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & GLOBAL ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0b141a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e9edef;
        }
        .app {
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            max-height: 100vh;
            background: #111b21;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100% - 60px);
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 380px;
            min-width: 300px;
            background: #111b21;
            border-right: 1px solid #2b3943;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 18px;
            background: #1f2c33;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2b3943;
            flex-shrink: 0;
        }
        .sidebar-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2b3943;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #e9edef;
            cursor: pointer;
            overflow: hidden;
        }
        .sidebar-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sidebar-header .actions {
            display: flex;
            gap: 6px;
        }
        .sidebar-header .actions button {
            background: transparent;
            border: none;
            color: #aebac1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-header .actions button:hover {
            background: #2b3943;
            color: #e9edef;
        }
        .search-bar {
            padding: 8px 12px;
            background: #111b21;
            flex-shrink: 0;
        }
        .search-bar .search-wrap {
            background: #1f2c33;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border: 1px solid transparent;
        }
        .search-bar .search-wrap:focus-within {
            border-color: #00a884;
        }
        .search-bar .search-wrap i {
            color: #8696a0;
            font-size: 14px;
        }
        .search-bar .search-wrap input {
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 0;
            flex: 1;
            color: #e9edef;
            font-size: 14px;
            font-family: inherit;
        }
        .search-bar .search-wrap input::placeholder {
            color: #8696a0;
        }
        .search-bar .search-wrap .search-hint {
            color: #8696a0;
            font-size: 12px;
            margin-right: 6px;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px 0;
            scrollbar-width: thin;
            scrollbar-color: #2b3943 transparent;
        }
        .contact-list::-webkit-scrollbar {
            width: 6px;
        }
        .contact-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .contact-list::-webkit-scrollbar-thumb {
            background: #2b3943;
            border-radius: 4px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            padding: 10px 18px;
            cursor: pointer;
            transition: 0.15s;
            gap: 14px;
            border-left: 3px solid transparent;
        }
        .contact-item:hover {
            background: #1f2c33;
        }
        .contact-item.active {
            background: #1f2c33;
            border-left-color: #00a884;
        }
        .contact-item .c-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2b3943;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 20px;
            color: #e9edef;
            overflow: hidden;
            position: relative;
        }
        .contact-item .c-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .contact-item .c-avatar .group-icon {
            font-size: 22px;
            color: #aebac1;
        }
        .contact-item .c-info {
            flex: 1;
            min-width: 0;
        }
        .contact-item .c-info .c-name {
            font-weight: 500;
            font-size: 16px;
            color: #e9edef;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .contact-item .c-info .c-name .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #31a24c;
            flex-shrink: 0;
        }
        .contact-item .c-info .c-preview {
            font-size: 14px;
            color: #8696a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .contact-item .c-meta {
            flex-shrink: 0;
            text-align: right;
            margin-left: auto;
            padding-left: 10px;
        }
        .contact-item .c-meta .c-time {
            font-size: 12px;
            color: #8696a0;
        }
        .contact-item .c-meta .c-badge {
            background: #00a884;
            color: #111b21;
            font-size: 11px;
            font-weight: 700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        /* ─── CHAT AREA ─── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            padding: 10px 18px;
            background: #1f2c33;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #2b3943;
            flex-shrink: 0;
            min-height: 60px;
        }
        .chat-header .back-btn {
            display: none;
            background: transparent;
            border: none;
            color: #aebac1;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .chat-header .ch-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2b3943;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #e9edef;
            overflow: hidden;
        }
        .chat-header .ch-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-header .ch-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header .ch-info .ch-name {
            font-weight: 500;
            font-size: 16px;
            color: #e9edef;
        }
        .chat-header .ch-info .ch-status {
            font-size: 13px;
            color: #8696a0;
        }
        .chat-header .ch-info .ch-status.online {
            color: #31a24c;
        }
        .chat-header .ch-actions {
            display: flex;
            gap: 2px;
        }
        .chat-header .ch-actions button {
            background: transparent;
            border: none;
            color: #aebac1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header .ch-actions button:hover {
            background: #2b3943;
            color: #e9edef;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px 10px 40px;
            background: #0b141a;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 168, 132, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 168, 132, 0.02) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: #2b3943 transparent;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #2b3943;
            border-radius: 4px;
        }

        .message {
            max-width: 65%;
            padding: 8px 12px 6px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            position: relative;
            word-wrap: break-word;
            font-size: 14.5px;
            line-height: 1.5;
            animation: msgIn 0.15s ease;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .message.sent {
            align-self: flex-end;
            background: #005c4b;
            color: #e9edef;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            align-self: flex-start;
            background: #1f2c33;
            color: #e9edef;
            border-bottom-left-radius: 2px;
        }
        .message .msg-time {
            font-size: 11px;
            color: #8696a0;
            text-align: right;
            margin-top: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .message.sent .msg-time {
            color: rgba(255, 255, 255, 0.5);
        }
        .message.sent .msg-time .check {
            color: #53bdeb;
        }
        .message .msg-sender {
            font-weight: 600;
            font-size: 13px;
            color: #aebac1;
            margin-bottom: 2px;
        }
        .message.sent .msg-sender {
            color: #53bdeb;
        }

        .date-divider {
            text-align: center;
            margin: 12px 0 16px 0;
            font-size: 12.5px;
            color: #8696a0;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .date-divider span {
            background: #1f2c33;
            padding: 4px 14px;
            border-radius: 8px;
            color: #aebac1;
            font-weight: 500;
            font-size: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .chat-input {
            padding: 8px 14px;
            background: #1f2c33;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #2b3943;
            flex-shrink: 0;
            min-height: 62px;
        }
        .chat-input .input-actions {
            display: flex;
            gap: 2px;
        }
        .chat-input .input-actions button {
            background: transparent;
            border: none;
            color: #aebac1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input .input-actions button:hover {
            background: #2b3943;
            color: #e9edef;
        }
        .chat-input .input-wrap {
            flex: 1;
            background: #111b21;
            border-radius: 8px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            border: 1px solid #2b3943;
            transition: 0.2s;
        }
        .chat-input .input-wrap:focus-within {
            border-color: #00a884;
        }
        .chat-input .input-wrap input {
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 0;
            flex: 1;
            color: #e9edef;
            font-size: 15px;
            font-family: inherit;
        }
        .chat-input .input-wrap input::placeholder {
            color: #8696a0;
        }
        .chat-input .send-btn {
            background: #00a884;
            border: none;
            color: #111b21;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-input .send-btn:hover {
            background: #00c9a0;
            transform: scale(1.04);
        }
        .chat-input .send-btn:active {
            transform: scale(0.94);
        }
        .chat-input .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8696a0;
            padding: 40px;
            text-align: center;
        }
        .empty-state i {
            font-size: 72px;
            color: #2b3943;
            margin-bottom: 20px;
        }
        .empty-state h2 {
            font-weight: 300;
            font-size: 24px;
            color: #e9edef;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }

        /* ─── TOAST NOTIFICATION ─── */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: #1f2c33;
            color: #e9edef;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border-left: 5px solid #00a884;
            animation: slideIn 0.3s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transition: 0.3s;
        }
        .toast i {
            color: #00a884;
            font-size: 22px;
        }
        .toast .toast-content {
            flex: 1;
        }
        .toast .toast-content strong {
            display: block;
            font-weight: 600;
            color: #e9edef;
        }
        .toast .toast-content span {
            color: #aebac1;
            font-size: 13px;
        }
        .toast .toast-close {
            background: transparent;
            border: none;
            color: #8696a0;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(60px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .toast.hide {
            opacity: 0;
            transform: translateX(80px);
        }

        /* ─── MODAL TAMBAH KONTAK ─── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }
        .modal {
            background: #1f2c33;
            border-radius: 20px;
            padding: 30px 32px;
            max-width: 480px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
            transition: 0.25s;
        }
        .modal-overlay.show .modal {
            transform: scale(1);
        }
        .modal h2 {
            font-weight: 500;
            font-size: 22px;
            margin-bottom: 6px;
            color: #e9edef;
        }
        .modal p {
            color: #8696a0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal .field {
            margin-bottom: 18px;
        }
        .modal .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aebac1;
            margin-bottom: 6px;
        }
        .modal .field input,
        .modal .field textarea {
            width: 100%;
            background: #111b21;
            border: 1px solid #2b3943;
            border-radius: 10px;
            padding: 12px 16px;
            color: #e9edef;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        .modal .field input:focus,
        .modal .field textarea:focus {
            border-color: #00a884;
        }
        .modal .field .code-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .modal .field .code-wrapper input {
            flex: 1;
        }
        .modal .field .code-wrapper button {
            background: #2b3943;
            border: none;
            color: #aebac1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .modal .field .code-wrapper button:hover {
            background: #3a4a56;
            color: #e9edef;
        }
        .modal .field .member-list {
            max-height: 200px;
            overflow-y: auto;
            background: #111b21;
            border-radius: 10px;
            padding: 8px;
            border: 1px solid #2b3943;
        }
        .modal .field .member-list .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .modal .field .member-list .member-item:hover {
            background: #1f2c33;
        }
        .modal .field .member-list .member-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00a884;
            cursor: pointer;
        }
        .modal .field .member-list .member-item .m-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2b3943;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            overflow: hidden;
        }
        .modal .field .member-list .member-item .m-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal .field .member-list .member-item .m-name {
            font-size: 14px;
            color: #e9edef;
        }
        .modal .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .modal .actions button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal .actions .btn-cancel {
            background: transparent;
            color: #aebac1;
        }
        .modal .actions .btn-cancel:hover {
            background: #2b3943;
        }
        .modal .actions .btn-add {
            background: #00a884;
            color: #111b21;
        }
        .modal .actions .btn-add:hover {
            background: #00c9a0;
        }

        /* ─── MODAL PESAN MASUK ─── */
        .modal-incoming .modal textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-incoming .modal .incoming-member-select {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .modal-incoming .modal .incoming-member-select select {
            background: #111b21;
            border: 1px solid #2b3943;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e9edef;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            flex: 1;
        }
        .modal-incoming .modal .incoming-member-select select:focus {
            border-color: #00a884;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 820px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
            }
            .sidebar.hidden {
                display: none;
            }
            .chat-area .back-btn {
                display: flex !important;
            }
            .chat-messages {
                padding: 16px 14px 10px 14px;
            }
            .message {
                max-width: 80%;
            }
            .app {
                max-height: 100vh;
                height: 100vh;
                border-radius: 0;
            }
            .chat-header .ch-actions button {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
        @media (max-width: 480px) {
            .sidebar-header {
                padding: 12px 14px;
            }
            .contact-item {
                padding: 8px 14px;
                gap: 10px;
            }
            .contact-item .c-avatar {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            .chat-header {
                padding: 6px 12px;
                min-height: 52px;
            }
            .chat-input {
                padding: 6px 10px;
                gap: 6px;
                min-height: 54px;
            }
            .chat-input .send-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .chat-messages {
                padding: 12px 10px 8px 10px;
            }
            .message {
                max-width: 88%;
                font-size: 14px;
                padding: 6px 10px 4px 10px;
            }
            .modal {
                padding: 20px;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b3943;
            border-radius: 4px;
        }
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: #8696a0;
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="main">

            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="avatar" id="myAvatar">
                        <img src="https://ui-avatars.com/api/?name=Saya&background=00a884&color=fff&size=40" alt="Saya" />
                    </div>
                    <div class="actions">
                        <button title="Tambah Kontak" id="addContactBtn" aria-label="Tambah kontak">
                            <i class="fas fa-user-plus"></i>
                        </button>
                        <button title="Buat Grup" id="createGroupBtn" aria-label="Buat grup">
                            <i class="fas fa-users"></i>
                        </button>
                        <button title="Status" aria-label="Status"><i class="fas fa-circle"></i></button>
                        <button title="Menu" aria-label="Menu"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <div class="search-bar">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Cari nama atau kode..." id="searchInput" />
                        <span class="search-hint"><i class="fas fa-key"></i></span>
                    </div>
                </div>

                <div class="contact-list" id="contactList">
                    <!-- contacts injected by JS -->
                </div>
            </aside>

            <!-- CHAT AREA -->
            <section class="chat-area" id="chatArea">
                <div class="chat-header" id="chatHeader">
                    <button class="back-btn" id="backBtn" aria-label="Kembali"><i class="fas fa-arrow-left"></i></button>
                    <div class="ch-avatar" id="chAvatar">
                        <img src="https://ui-avatars.com/api/?name=?&background=2b3943&color=fff&size=40" alt="Contact" />
                    </div>
                    <div class="ch-info">
                        <div class="ch-name" id="chName">Pilih kontak</div>
                        <div class="ch-status" id="chStatus">Klik untuk memulai chat</div>
                    </div>
                    <div class="ch-actions">
                        <button title="Pesan Masuk (simulasi)" id="incomingBtn" aria-label="Pesan masuk">
                            <i class="fas fa-envelope"></i>
                        </button>
                        <button title="Panggilan video" aria-label="Panggilan video"><i class="fas fa-video"></i></button>
                        <button title="Panggilan suara" aria-label="Panggilan suara"><i class="fas fa-phone"></i></button>
                        <button title="Menu" aria-label="Menu"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state" id="emptyState">
                        <i class="fab fa-whatsapp"></i>
                        <h2>WhatsApp Web</h2>
                        <p>Pilih kontak atau grup di sebelah kiri untuk mulai mengirim pesan</p>
                    </div>
                </div>

                <div class="chat-input" id="chatInput">
                    <div class="input-actions">
                        <button title="Emoji" aria-label="Emoji"><i class="far fa-smile"></i></button>
                        <button title="Lampiran" aria-label="Lampiran"><i class="fas fa-paperclip"></i></button>
                    </div>
                    <div class="input-wrap">
                        <input type="text" placeholder="Ketik pesan..." id="msgInput" />
                    </div>
                    <button class="send-btn" id="sendBtn" aria-label="Kirim" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </section>

        </div>
    </div>

    <!-- Modal Tambah Kontak -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Tambah Kontak Baru</h2>
            <p>Masukkan nama dan kode unik untuk kontak ini.</p>
            <div class="field">
                <label>Nama Kontak</label>
                <input type="text" id="newName" placeholder="Misal: Andi" />
            </div>
            <div class="field">
                <label>Kode Unik</label>
                <div class="code-wrapper">
                    <input type="text" id="newCode" placeholder="Kode otomatis" readonly />
                    <button id="generateCodeBtn">Generate</button>
                </div>
            </div>
            <div class="actions">
                <button class="btn-cancel" id="modalCancel">Batal</button>
                <button class="btn-add" id="modalAdd">Tambah Kontak</button>
            </div>
        </div>
    </div>

    <!-- Modal Buat Grup -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal">
            <h2>Buat Grup Baru</h2>
            <p>Pilih anggota dan beri nama grup.</p>
            <div class="field">
                <label>Nama Grup</label>
                <input type="text" id="groupName" placeholder="Nama grup..." />
            </div>
            <div class="field">
                <label>Pilih Anggota</label>
                <div class="member-list" id="groupMemberList">
                    <!-- akan diisi oleh JS -->
                </div>
            </div>
            <div class="actions">
                <button class="btn-cancel" id="groupCancel">Batal</button>
                <button class="btn-add" id="groupCreate">Buat Grup</button>
            </div>
        </div>
    </div>

    <!-- Modal Pesan Masuk (simulasi dari teman/grup) -->
    <div class="modal-overlay modal-incoming" id="incomingModal">
        <div class="modal">
            <h2>Pesan Masuk</h2>
            <p>Kirim pesan seolah-olah dari <span id="incomingTarget">kontak</span>.</p>
            <div class="field">
                <label>Pengirim</label>
                <div class="incoming-member-select">
                    <select id="incomingSenderSelect"></select>
                </div>
            </div>
            <div class="field">
                <label>Isi Pesan</label>
                <textarea id="incomingText" placeholder="Ketik pesan..."></textarea>
            </div>
            <div class="actions">
                <button class="btn-cancel" id="incomingCancel">Batal</button>
                <button class="btn-add" id="incomingSend">Kirim</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ──────────────────────────────────────────────
        //  DATA & STATE
        // ──────────────────────────────────────────────

        const messageHistory = {};
        let contacts = [];
        let nextId = 1;

        // Data awal: kontak individual
        const initialContacts = [{
            id: nextId++,
            name: 'Aulia',
            avatar: 'https://ui-avatars.com/api/?name=Aulia&background=7c4dff&color=fff&size=50',
            online: true,
            lastMsg: '',
            time: '',
            badge: 0,
            code: 'A1B2C3',
            type: 'individual'
        }, {
            id: nextId++,
            name: 'Budi Santoso',
            avatar: 'https://ui-avatars.com/api/?name=Budi+Santoso&background=ff6d00&color=fff&size=50',
            online: false,
            lastMsg: '',
            time: '',
            badge: 0,
            code: 'D4E5F6',
            type: 'individual'
        }, {
            id: nextId++,
            name: 'Citra Dewi',
            avatar: 'https://ui-avatars.com/api/?name=Citra+Dewi&background=e91e63&color=fff&size=50',
            online: true,
            lastMsg: '',
            time: '',
            badge: 0,
            code: 'G7H8I9',
            type: 'individual'
        }];

        contacts = initialContacts;
        contacts.forEach(c => { messageHistory[c.id] = []; });

        let activeContactId = null;
        let isMobile = window.innerWidth <= 820;

        // Nama pengguna kita
        const MY_NAME = 'Saya';
        const MY_ID = 'me'; // tidak digunakan sebagai kontak, hanya untuk label

        // ──────────────────────────────────────────────
        //  DOM REFS
        // ──────────────────────────────────────────────

        const contactListEl = document.getElementById('contactList');
        const chatMessagesEl = document.getElementById('chatMessages');
        const emptyStateEl = document.getElementById('emptyState');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const chName = document.getElementById('chName');
        const chStatus = document.getElementById('chStatus');
        const chAvatar = document.getElementById('chAvatar');
        const backBtn = document.getElementById('backBtn');
        const sidebar = document.getElementById('sidebar');
        const searchInput = document.getElementById('searchInput');
        const addContactBtn = document.getElementById('addContactBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCancel = document.getElementById('modalCancel');
        const modalAdd = document.getElementById('modalAdd');
        const newName = document.getElementById('newName');
        const newCode = document.getElementById('newCode');
        const generateCodeBtn = document.getElementById('generateCodeBtn');
        const toastContainer = document.getElementById('toastContainer');

        // Group modal
        const groupModal = document.getElementById('groupModal');
        const groupNameInput = document.getElementById('groupName');
        const groupMemberList = document.getElementById('groupMemberList');
        const groupCancel = document.getElementById('groupCancel');
        const groupCreate = document.getElementById('groupCreate');
        const createGroupBtn = document.getElementById('createGroupBtn');

        // Incoming modal
        const incomingModal = document.getElementById('incomingModal');
        const incomingTarget = document.getElementById('incomingTarget');
        const incomingSenderSelect = document.getElementById('incomingSenderSelect');
        const incomingText = document.getElementById('incomingText');
        const incomingCancel = document.getElementById('incomingCancel');
        const incomingSend = document.getElementById('incomingSend');
        const incomingBtn = document.getElementById('incomingBtn');

        // ──────────────────────────────────────────────
        //  HELPERS
        // ──────────────────────────────────────────────

        function formatTime(d) {
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return h + ':' + m;
        }

        function getTimeNow() {
            return formatTime(new Date());
        }

        function getInitials(name) {
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function getAvatarImg(contact) {
            if (contact.avatar && contact.avatar.startsWith('http')) {
                return contact.avatar;
            }
            return null;
        }

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function getContact(id) {
            return contacts.find(c => c.id === id);
        }

        function getContactName(id) {
            const c = getContact(id);
            return c ? c.name : 'Unknown';
        }

        function isGroup(id) {
            const c = getContact(id);
            return c && c.type === 'group';
        }

        function getGroupMembers(id) {
            const c = getContact(id);
            return c && c.type === 'group' ? c.members || [] : [];
        }

        // ──────────────────────────────────────────────
        //  TOAST NOTIFICATION
        // ──────────────────────────────────────────────

        function showToast(fromName, message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
            <i class="fas fa-comment"></i>
            <div class="toast-content">
              <strong>${fromName}</strong>
              <span>${message}</span>
            </div>
            <button class="toast-close">&times;</button>
          `;
            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            });
            toastContainer.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
        }

        // ──────────────────────────────────────────────
        //  RENDER CONTACT LIST
        // ──────────────────────────────────────────────

        function renderContacts(filter = '') {
            const q = filter.toLowerCase().trim();
            let list = contacts;
            if (q) {
                list = contacts.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    (c.code && c.code.toLowerCase().includes(q)) ||
                    (c.type === 'group' && c.members && c.members.some(mid =>
                        getContactName(mid).toLowerCase().includes(q)
                    ))
                );
            }
            contactListEl.innerHTML = '';
            if (list.length === 0) {
                contactListEl.innerHTML =
                    `<div style="padding:40px 20px;text-align:center;color:#8696a0;font-size:14px;">Tidak ada kontak atau grup</div>`;
                return;
            }
            list.forEach(c => {
                const isActive = c.id === activeContactId;
                const div = document.createElement('div');
                div.className = `contact-item${isActive ? ' active' : ''}`;
                div.dataset.id = c.id;
                let avatarContent;
                if (c.type === 'group') {
                    avatarContent = `<span class="group-icon"><i class="fas fa-users"></i></span>`;
                } else {
                    const img = getAvatarImg(c);
                    avatarContent = img ? `<img src="${img}" alt="${c.name}" />` : getInitials(c.name);
                }
                const onlineDot = (c.type === 'individual' && c.online) ? '<span class="online-dot"></span>' : '';
                const badgeHTML = c.badge > 0 ? `<span class="c-badge">${c.badge}</span>` : '';
                const preview = c.lastMsg || (c.type === 'group' ? 'Grup' : 'Mulai chat');
                const time = c.time || '';
                div.innerHTML = `
              <div class="c-avatar">${avatarContent}</div>
              <div class="c-info">
                <div class="c-name">${c.name} ${onlineDot}</div>
                <div class="c-preview">${preview}</div>
              </div>
              <div class="c-meta">
                <div class="c-time">${time}</div>
                ${badgeHTML}
              </div>
            `;
                div.addEventListener('click', () => openChat(c.id));
                contactListEl.appendChild(div);
            });
        }

        // ──────────────────────────────────────────────
        //  RENDER MESSAGES
        // ──────────────────────────────────────────────

        function renderMessages(contactId) {
            const msgs = messageHistory[contactId] || [];
            chatMessagesEl.innerHTML = '';
            emptyStateEl.style.display = 'none';

            if (msgs.length === 0) {
                const emptyChat = document.createElement('div');
                emptyChat.style.cssText =
                    'flex:1;display:flex;align-items:center;justify-content:center;color:#8696a0;font-size:14px;';
                emptyChat.textContent = 'Belum ada pesan. Kirim pesan atau tambahkan pesan masuk.';
                chatMessagesEl.appendChild(emptyChat);
                return;
            }

            const divider = document.createElement('div');
            divider.className = 'date-divider';
            divider.innerHTML = `<span>Hari ini</span>`;
            chatMessagesEl.appendChild(divider);

            msgs.forEach((msg) => {
                const div = document.createElement('div');
                const isSent = msg.from === 'sent';
                div.className = `message ${isSent ? 'sent' : 'received'}`;

                let senderLabel = '';
                if (!isSent && msg.senderName) {
                    senderLabel = `<div class="msg-sender">${msg.senderName}</div>`;
                } else if (isSent) {
                    senderLabel = `<div class="msg-sender">Anda</div>`;
                }

                const checkIcon = isSent ?
                    `<span class="check"><i class="fas fa-check-double"></i></span>` :
                    '';

                div.innerHTML = `
              ${senderLabel}
              <div class="msg-text">${msg.text}</div>
              <div class="msg-time">${msg.time || getTimeNow()} ${checkIcon}</div>
            `;
                chatMessagesEl.appendChild(div);
            });

            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }

        // ──────────────────────────────────────────────
        //  OPEN CHAT
        // ──────────────────────────────────────────────

        function openChat(contactId) {
            const contact = getContact(contactId);
            if (!contact) return;

            activeContactId = contactId;

            // Update sidebar highlight
            document.querySelectorAll('.contact-item').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.id) === contactId);
            });

            // Update header
            chName.textContent = contact.name;
            if (contact.type === 'group') {
                chAvatar.innerHTML = `<span style="font-size:20px;"><i class="fas fa-users"></i></span>`;
                chStatus.textContent = `Grup • ${contact.members ? contact.members.length : 0} anggota`;
                chStatus.className = 'ch-status';
            } else {
                const avatarImg = getAvatarImg(contact);
                chAvatar.innerHTML = avatarImg ?
                    `<img src="${avatarImg}" alt="${contact.name}" />` :
                    getInitials(contact.name);
                chStatus.textContent = contact.online ? 'Online' : 'Terakhir dilihat beberapa waktu lalu';
                chStatus.className = `ch-status${contact.online ? ' online' : ''}`;
            }

            // Render messages
            renderMessages(contactId);

            // Enable input
            msgInput.disabled = false;
            msgInput.placeholder = 'Ketik pesan...';
            msgInput.focus();
            sendBtn.disabled = false;

            // Mobile
            if (isMobile) {
                sidebar.classList.add('hidden');
            }

            // Clear badge
            contact.badge = 0;
            renderContacts(searchInput.value);
        }

        // ──────────────────────────────────────────────
        //  SEND MESSAGE (dari kita)
        // ──────────────────────────────────────────────

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || activeContactId === null) return;

            const contact = getContact(activeContactId);
            if (!contact) return;

            const newMsg = {
                from: 'sent',
                text: text,
                time: getTimeNow(),
                senderName: MY_NAME, // untuk grup, tapi kita labeli "Anda"
            };
            if (!messageHistory[activeContactId]) {
                messageHistory[activeContactId] = [];
            }
            messageHistory[activeContactId].push(newMsg);

            contact.lastMsg = text;
            contact.time = getTimeNow();

            renderMessages(activeContactId);
            renderContacts(searchInput.value);

            msgInput.value = '';
            sendBtn.disabled = true;
        }

        // ──────────────────────────────────────────────
        //  PESAN MASUK (simulasi dari teman / grup)
        // ──────────────────────────────────────────────

        function openIncomingModal() {
            if (activeContactId === null) {
                alert('Pilih kontak atau grup terlebih dahulu.');
                return;
            }
            const contact = getContact(activeContactId);
            if (!contact) return;

            // Isi target
            incomingTarget.textContent = contact.name;

            // Isi pilihan pengirim
            incomingSenderSelect.innerHTML = '';
            if (contact.type === 'group') {
                // Untuk grup, kita tampilkan semua anggota (kecuali kita)
                const members = contact.members || [];
                members.forEach(mid => {
                    const m = getContact(mid);
                    if (m) {
                        const opt = document.createElement('option');
                        opt.value = mid;
                        opt.textContent = m.name;
                        incomingSenderSelect.appendChild(opt);
                    }
                });
                if (incomingSenderSelect.options.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'Tidak ada anggota';
                    incomingSenderSelect.appendChild(opt);
                }
            } else {
                // Untuk individual, hanya satu pilihan yaitu kontak itu sendiri
                const opt = document.createElement('option');
                opt.value = contact.id;
                opt.textContent = contact.name;
                incomingSenderSelect.appendChild(opt);
            }

            incomingText.value = '';
            incomingModal.classList.add('show');
            incomingText.focus();
        }

        function sendIncomingMessage() {
            const text = incomingText.value.trim();
            if (!text) {
                alert('Pesan tidak boleh kosong.');
                return;
            }
            if (activeContactId === null) return;
            const contact = getContact(activeContactId);
            if (!contact) return;

            const senderId = parseInt(incomingSenderSelect.value);
            if (!senderId) {
                alert('Pilih pengirim terlebih dahulu.');
                return;
            }
            const sender = getContact(senderId);
            if (!sender) {
                alert('Pengirim tidak valid.');
                return;
            }

            const newMsg = {
                from: 'received',
                text: text,
                time: getTimeNow(),
                senderName: sender.name,
                senderId: senderId,
            };
            if (!messageHistory[activeContactId]) {
                messageHistory[activeContactId] = [];
            }
            messageHistory[activeContactId].push(newMsg);

            contact.lastMsg = text;
            contact.time = getTimeNow();

            // Badge jika chat tidak aktif
            if (activeContactId !== contact.id) {
                contact.badge = (contact.badge || 0) + 1;
            }

            renderMessages(activeContactId);
            renderContacts(searchInput.value);

            // Notifikasi
            showToast(sender.name, text);

            closeIncomingModal();
        }

        function closeIncomingModal() {
            incomingModal.classList.remove('show');
        }

        // ──────────────────────────────────────────────
        //  TAMBAH KONTAK
        // ──────────────────────────────────────────────

        function openModal() {
            modalOverlay.classList.add('show');
            newName.value = '';
            newCode.value = generateCode();
            newName.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('show');
        }

        function addContact() {
            const name = newName.value.trim();
            let code = newCode.value.trim().toUpperCase();
            if (!name) {
                alert('Nama kontak wajib diisi!');
                return;
            }
            if (!code) {
                code = generateCode();
            }
            if (contacts.some(c => c.code === code)) {
                alert('Kode sudah digunakan, generate ulang atau masukkan kode lain.');
                return;
            }

            const newContact = {
                id: nextId++,
                name: name,
                avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&size=50`,
                online: false,
                lastMsg: '',
                time: '',
                badge: 0,
                code: code,
                type: 'individual'
            };
            contacts.push(newContact);
            messageHistory[newContact.id] = [];
            renderContacts(searchInput.value);
            closeModal();
            openChat(newContact.id);
        }

        // ──────────────────────────────────────────────
        //  BUAT GRUP
        // ──────────────────────────────────────────────

        function openGroupModal() {
            groupModal.classList.add('show');
            groupNameInput.value = '';
            // Isi daftar anggota (hanya individual, tidak termasuk grup)
            groupMemberList.innerHTML = '';
            const individualContacts = contacts.filter(c => c.type === 'individual');
            if (individualContacts.length === 0) {
                groupMemberList.innerHTML = '<div class="text-muted" style="padding:10px;">Tidak ada kontak individual untuk diundang.</div>';
            } else {
                individualContacts.forEach(c => {
                    const label = document.createElement('label');
                    label.className = 'member-item';
                    const checked = c.id === contacts[0]?.id ? 'checked' : ''; // default pilih yang pertama
                    label.innerHTML = `
                <input type="checkbox" value="${c.id}" ${checked} />
                <span class="m-avatar">${getAvatarImg(c) ? `<img src="${getAvatarImg(c)}" />` : getInitials(c.name)}</span>
                <span class="m-name">${c.name}</span>
              `;
                    groupMemberList.appendChild(label);
                });
            }
            groupNameInput.focus();
        }

        function closeGroupModal() {
            groupModal.classList.remove('show');
        }

        function createGroup() {
            const name = groupNameInput.value.trim() || 'Grup Baru';
            const checkboxes = groupMemberList.querySelectorAll('input[type="checkbox"]:checked');
            const memberIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (memberIds.length < 2) {
                alert('Pilih minimal 2 anggota untuk membuat grup.');
                return;
            }

            // Buat grup baru
            const newGroup = {
                id: nextId++,
                name: name,
                type: 'group',
                members: memberIds,
                lastMsg: '',
                time: '',
                badge: 0,
                code: null, // grup tidak punya kode
                avatar: null,
                online: false,
            };
            contacts.push(newGroup);
            messageHistory[newGroup.id] = [];
            renderContacts(searchInput.value);
            closeGroupModal();
            openChat(newGroup.id);
        }

        // ──────────────────────────────────────────────
        //  EVENT LISTENERS
        // ──────────────────────────────────────────────

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        msgInput.addEventListener('input', () => {
            sendBtn.disabled = msgInput.value.trim().length === 0 || activeContactId === null;
        });

        backBtn.addEventListener('click', () => {
            sidebar.classList.remove('hidden');
            document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
            activeContactId = null;
            chName.textContent = 'Pilih kontak';
            chStatus.textContent = 'Klik untuk memulai chat';
            chStatus.className = 'ch-status';
            chAvatar.innerHTML =
                '<img src="https://ui-avatars.com/api/?name=?&background=2b3943&color=fff&size=40" alt="Contact" />';
            chatMessagesEl.innerHTML = `
            <div class="empty-state" id="emptyState">
              <i class="fab fa-whatsapp"></i>
              <h2>WhatsApp Web</h2>
              <p>Pilih kontak atau grup di sebelah kiri untuk mulai mengirim pesan</p>
            </div>
          `;
            msgInput.disabled = true;
            msgInput.placeholder = 'Pilih kontak terlebih dahulu';
            sendBtn.disabled = true;
            msgInput.value = '';
        });

        searchInput.addEventListener('input', () => {
            renderContacts(searchInput.value);
        });

        // Modal tambah kontak
        addContactBtn.addEventListener('click', openModal);
        modalCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        modalAdd.addEventListener('click', addContact);
        generateCodeBtn.addEventListener('click', () => {
            newCode.value = generateCode();
        });
        newName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addContact();
            }
        });

        // Modal buat grup
        createGroupBtn.addEventListener('click', openGroupModal);
        groupCancel.addEventListener('click', closeGroupModal);
        groupModal.addEventListener('click', (e) => {
            if (e.target === groupModal) closeGroupModal();
        });
        groupCreate.addEventListener('click', createGroup);
        groupNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                createGroup();
            }
        });

        // Incoming modal
        incomingBtn.addEventListener('click', openIncomingModal);
        incomingCancel.addEventListener('click', closeIncomingModal);
        incomingModal.addEventListener('click', (e) => {
            if (e.target === incomingModal) closeIncomingModal();
        });
        incomingSend.addEventListener('click', sendIncomingMessage);
        incomingText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendIncomingMessage();
            }
        });

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 820;
            if (!isMobile) {
                sidebar.classList.remove('hidden');
            }
        });

        // ──────────────────────────────────────────────
        //  INIT
        // ──────────────────────────────────────────────

        renderContacts();
        msgInput.disabled = true;
        msgInput.placeholder = 'Pilih kontak atau grup';
        sendBtn.disabled = true;

        console.log('💬 WhatsApp Web — Chat & Grup');
        console.log('👉 Tambah kontak dengan tombol (+).');
        console.log('👉 Buat grup dengan tombol users.');
        console.log('👉 Cari kontak dengan kode di search bar.');
        console.log('👉 Kirim pesan masuk dari teman/grup pakai tombol amplop.');
    </script>
</body>
</html>
