<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Web</title>
<style>
  :root{
    --bg-app:#0b141a;
    --bg-sidebar:#111b21;
    --bg-header:#202c33;
    --bg-panel-hover:#2a3942;
    --bg-active:#2a3942;
    --bg-input:#2a3942;
    --accent:#00a884;
    --accent-dark:#008069;
    --border:#222d34;
    --text-main:#e9edef;
    --text-muted:#8696a0;
    --bubble-out:#005c4b;
    --bubble-in:#202c33;
    --online:#00d757;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0c1317;color:var(--text-main);-webkit-font-smoothing:antialiased;
  }
  #root{height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:#0c1317;}
  a{color:inherit;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#00a884 0%,#00a884 28%,#0c1317 28%,#0c1317 100%);
  }
  .login-card{
    background:#111b21;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.5);
    padding:44px 48px;width:420px;max-width:92vw;text-align:center;border:1px solid var(--border);
  }
  .login-logo{
    width:64px;height:64px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .login-logo svg{width:34px;height:34px;fill:#fff;}
  .login-card h1{font-size:22px;margin:0 0 6px;font-weight:600;color:var(--text-main);}
  .login-card p{color:var(--text-muted);font-size:14px;margin:0 0 24px;line-height:1.5;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1px solid #2a3942;border-radius:8px;
    font-size:15px;outline:none;transition:border-color .15s;background:#1f2c34;color:var(--text-main);
  }
  .field input::placeholder{color:#5f7178;}
  .field input:focus{border-color:var(--accent);}
  .login-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:filter .15s;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}
  .btn-primary{background:var(--accent);color:#062b23;flex:1;}
  .btn-secondary{background:#2a3942;color:var(--text-main);}
  .hint-row{margin-top:14px;font-size:13px;color:var(--text-muted);}
  .code-generated{
    font-family:"Courier New",monospace;font-size:20px;letter-spacing:3px;font-weight:700;
    background:#1f2c34;border-radius:8px;padding:10px;margin:10px 0 0;color:var(--online);
  }
  .err-msg{color:#ff6b6b;font-size:13px;margin-top:-6px;margin-bottom:12px;text-align:left;}
  .info-msg{color:var(--online);font-size:13px;margin-top:-6px;margin-bottom:12px;text-align:left;}
  .loading-line{font-size:13px;color:var(--text-muted);margin-top:14px;}
  .backend-note{font-size:11.5px;color:#5f7178;margin-top:18px;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  .app{width:100%;height:100%;display:flex;background:var(--bg-app);}
  .sidebar{width:400px;min-width:320px;max-width:40%;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-sidebar);}
  .sidebar-header{height:60px;background:var(--bg-header);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
  .avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;user-select:none;position:relative;overflow:hidden;}
  .avatar.sm{width:40px;height:40px;font-size:15px;}
  .avatar.md{width:49px;height:49px;font-size:17px;}
  .avatar.lg{width:72px;height:72px;font-size:24px;}
  .avatar.qm{background:#3a4a53;color:var(--text-muted);}
  .online-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--bg-sidebar);}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#aebac1;}
  .icon-btn:hover{background:#ffffff14;}
  .icon-btn svg{width:21px;height:21px;fill:currentColor;}
  .header-icons{display:flex;gap:2px;align-items:center;}

  .search-bar{padding:8px 12px;background:var(--bg-sidebar);flex-shrink:0;}
  .search-box{background:var(--bg-input);border-radius:8px;display:flex;align-items:center;padding:0 12px;height:36px;gap:8px;}
  .search-box svg{width:16px;height:16px;fill:#aebac1;flex-shrink:0;}
  .search-box input{border:none;background:transparent;outline:none;padding:0;font-size:14.5px;width:100%;color:var(--text-main);}
  .search-box input::placeholder{color:#8696a0;}

  .chat-list{flex:1;overflow-y:auto;}
  .chat-item{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #ffffff08;}
  .chat-item:hover{background:var(--bg-panel-hover);}
  .chat-item.active{background:var(--bg-active);}
  .chat-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .chat-item-top{display:flex;justify-content:space-between;align-items:baseline;}
  .chat-item-name{font-size:15px;font-weight:500;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-item-time{font-size:11.5px;color:var(--text-muted);flex-shrink:0;}
  .chat-item-preview{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-item-preview.unread{color:var(--text-main);font-weight:600;}
  .chat-item-time-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0;}

  .empty-list{padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13.5px;line-height:1.6;}
  .empty-list button{margin-top:14px;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-header{height:60px;background:var(--bg-header);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .chat-header-info{flex:1;min-width:0;cursor:default;}
  .chat-header-name{font-size:16px;font-weight:500;}
  .chat-header-sub{font-size:12.5px;color:var(--text-muted);}

  .messages{flex:1;overflow-y:auto;padding:20px 6%;background-color:#0b141a;
    background-image:radial-gradient(#ffffff05 1px, transparent 1px);background-size:22px 22px;
    display:flex;flex-direction:column;gap:2px;}
  .center-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);text-align:center;padding:20px;background:#0b141a;}
  .center-placeholder svg{width:150px;height:150px;opacity:.35;margin-bottom:22px;}
  .center-placeholder h2{font-weight:300;color:#dfe5e7;margin-bottom:10px;font-size:26px;}
  .my-code-banner{margin-top:22px;font-size:13px;background:#1f2c34;border-radius:8px;padding:10px 16px;}
  .my-code-banner b{color:var(--online);letter-spacing:1px;}

  .msg-row{display:flex;margin:2px 0;}
  .msg-row.out{justify-content:flex-end;}
  .bubble{max-width:65%;padding:6px 9px 8px 9px;border-radius:8px;position:relative;font-size:14.3px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.3);}
  .bubble.in{background:var(--bubble-in);border-top-left-radius:0;}
  .bubble.out{background:var(--bubble-out);border-top-right-radius:0;}
  .bubble .sender-tag{font-size:12.5px;font-weight:600;color:#6bd6c5;margin-bottom:2px;display:block;}
  .bubble .msg-text{white-space:pre-wrap;word-break:break-word;color:var(--text-main);}
  .bubble.bubble-file{padding:6px;}
  .file-image{max-width:240px;max-height:280px;border-radius:6px;display:block;cursor:pointer;}
  .file-chip{display:flex;align-items:center;gap:8px;background:#ffffff10;padding:9px 11px;border-radius:8px;text-decoration:none;color:var(--text-main);min-width:160px;}
  .file-chip:hover{background:#ffffff1c;}
  .file-chip-icon{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .file-chip-icon svg{width:18px;height:18px;fill:#062b23;}
  .file-chip-name{font-size:13.5px;word-break:break-word;}
  .bubble .msg-meta{display:flex;justify-content:flex-end;gap:4px;margin-top:2px;font-size:10.5px;color:#8696a0;align-items:center;}
  .day-divider{align-self:center;background:#182229;color:#8fa3ad;font-size:12px;padding:5px 12px;border-radius:8px;margin:10px 0;}
  .msg-image{max-width:260px;max-height:320px;border-radius:6px;display:block;cursor:pointer;margin-bottom:2px;}
  .msg-file-card{display:flex;align-items:center;gap:10px;background:#0b141a55;border-radius:6px;padding:8px 10px;margin-bottom:2px;min-width:180px;}
  .msg-file-card .file-ic{width:34px;height:34px;border-radius:6px;background:#00a88433;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .msg-file-card .file-ic svg{width:18px;height:18px;fill:var(--accent);}
  .msg-file-card .file-info{min-width:0;flex:1;}
  .msg-file-card .file-name{font-size:13.5px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .msg-file-card .file-size{font-size:11.5px;color:var(--text-muted);}
  .msg-file-card a{color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none;flex-shrink:0;}

  .chat-input-bar{background:var(--bg-header);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .chat-input-bar input{flex:1;border:none;border-radius:20px;padding:11px 16px;font-size:14.5px;outline:none;background:var(--bg-input);color:var(--text-main);}
  .chat-input-bar input::placeholder{color:#8696a0;}
  .chat-input-bar input:disabled{opacity:.6;cursor:not-allowed;}
  .send-btn{background:transparent;border:none;cursor:pointer;color:#aebac1;display:flex;}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}
  .send-btn svg{width:24px;height:24px;fill:currentColor;}

  /* ---------- MODALS ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#111b21;border-radius:10px;width:420px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);}
  .modal-header{background:var(--bg-header);color:#fff;padding:18px 20px;font-size:17px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
  .modal-header button{background:none;border:none;color:#fff;cursor:pointer;}
  .modal-header svg{width:20px;height:20px;fill:#fff;}
  .modal-body{padding:20px;overflow-y:auto;}
  .modal-footer{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);}
  .contact-pick-row{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;border-radius:6px;}
  .contact-pick-row:hover{background:var(--bg-panel-hover);}
  .contact-pick-row input{width:18px;height:18px;accent-color:var(--accent);}
  .muted-note{font-size:12.5px;color:var(--text-muted);margin-top:6px;}
  .copy-row{display:flex;gap:8px;align-items:center;}
  .copy-row .code-generated{flex:1;margin:0;text-align:center;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#233138;color:#e9edef;
    padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:100;
    opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#2a3942;border-radius:4px;}

  /* ---------- SIDEBAR TABS ---------- */
  .sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
  .tab-btn{flex:1;background:none;border:none;color:var(--text-muted);padding:10px 0;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn:hover{background:var(--bg-panel-hover);}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

  /* ---------- REPLY ---------- */
  .bubble{position:relative;}
  .msg-actions{position:absolute;top:2px;display:none;gap:1px;background:#0b141acc;border-radius:14px;padding:2px;}
  .bubble:hover .msg-actions{display:flex;}
  .bubble.out .msg-actions{left:-58px;}
  .bubble.in .msg-actions{right:-58px;}
  .msg-action-btn{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:#cfd6d9;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .msg-action-btn:hover{background:#ffffff22;}
  .msg-action-btn svg{width:13px;height:13px;fill:currentColor;}
  .reply-quote{background:#ffffff14;border-left:3px solid var(--accent);padding:4px 8px;border-radius:4px;margin-bottom:4px;font-size:12px;color:#c8d0d3;cursor:pointer;}
  .reply-quote b{color:var(--accent);display:block;font-size:12px;}
  .reply-bar{background:var(--bg-header);padding:8px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);flex-shrink:0;}
  .reply-bar-line{flex:1;border-left:3px solid var(--accent);padding-left:10px;min-width:0;}
  .reply-bar-line b{display:block;font-size:12.5px;color:var(--accent);}
  .reply-bar-line span{display:block;font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reply-bar button{background:none;border:none;color:var(--text-muted);cursor:pointer;}
  .reply-bar button svg{width:18px;height:18px;fill:currentColor;}

  /* ---------- HEADER MENU (dots) ---------- */
  .header-menu-wrap{position:relative;}
  .header-menu{position:absolute;top:46px;right:0;background:#233138;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.5);min-width:210px;z-index:60;overflow:hidden;}
  .header-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text-main);padding:12px 16px;font-size:14px;cursor:pointer;}
  .header-menu button:hover{background:var(--bg-panel-hover);}
  .header-menu button.danger{color:#ff6b6b;}

  /* ---------- STATUS ---------- */
  .status-row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;}
  .status-row:hover{background:var(--bg-panel-hover);}
  .status-avatar-wrap{position:relative;flex-shrink:0;}
  .status-ring{border-radius:50%;padding:2px;border:2.5px solid #3a4a53;display:flex;}
  .status-ring.unseen{border-color:var(--accent);}
  .status-add-badge{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#062b23;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid var(--bg-sidebar);line-height:1;}
  .status-section-title{padding:12px 16px 4px;font-size:13px;color:var(--accent);font-weight:600;}
  .status-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;}
  .status-card{width:420px;max-width:100vw;height:100%;max-height:100vh;display:flex;flex-direction:column;position:relative;}
  .status-progress{display:flex;gap:4px;padding:10px 10px 0;}
  .status-progress .seg{flex:1;height:3px;background:#ffffff40;border-radius:2px;overflow:hidden;}
  .status-progress .seg.filled{background:#fff;}
  .status-viewer-header{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;}
  .status-viewer-header .who{flex:1;min-width:0;}
  .status-viewer-header .who b{display:block;font-size:14.5px;}
  .status-viewer-header .who span{font-size:12px;color:#d1d7da;}
  .status-viewer-header button{background:none;border:none;color:#fff;cursor:pointer;}
  .status-viewer-header button svg{width:20px;height:20px;fill:#fff;}
  .status-content{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:36px;font-size:26px;font-weight:600;color:#fff;word-break:break-word;line-height:1.4;}
  .status-nav-zone{position:absolute;top:60px;bottom:0;width:35%;cursor:pointer;}
  .status-nav-zone.left{left:0;} .status-nav-zone.right{right:0;}
  .status-empty{padding:30px 24px;text-align:center;color:var(--text-muted);font-size:13px;}
  .color-swatch-row{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;}
  .color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--accent);}
  .status-text-preview{border-radius:10px;padding:30px 16px;text-align:center;color:#fff;font-size:19px;font-weight:600;margin-top:6px;min-height:110px;display:flex;align-items:center;justify-content:center;word-break:break-word;}
  .status-textarea{width:100%;background:#1f2c34;border:1px solid #2a3942;border-radius:8px;color:var(--text-main);padding:10px 12px;font-size:14.5px;resize:vertical;min-height:70px;outline:none;font-family:inherit;}
  .status-textarea:focus{border-color:var(--accent);}

  /* ---------- NOTES (CATATAN) ---------- */
  .notes-toolbar{padding:10px 16px;flex-shrink:0;}
  .note-row{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff08;}
  .note-row:hover{background:var(--bg-panel-hover);}
  .note-text{flex:1;font-size:13.5px;color:var(--text-main);white-space:pre-wrap;word-break:break-word;}
  .note-time{font-size:11px;color:var(--text-muted);margin-top:4px;}
  .note-actions{display:flex;gap:2px;flex-shrink:0;}

  /* ---------- AVATAR FOTO ---------- */
  .avatar{overflow:hidden;}
  .profile-photo-wrap{position:relative;width:88px;height:88px;margin:0 auto 14px;}
  .profile-photo-wrap .avatar{width:88px;height:88px;font-size:28px;}
  .profile-photo-edit-badge{position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#062b23;display:flex;align-items:center;justify-content:center;border:2px solid #111b21;cursor:pointer;}
  .profile-photo-edit-badge svg{width:15px;height:15px;fill:#062b23;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0;}

  /* ---------- STICKER ---------- */
  .bubble.sticker-bubble{background:transparent!important;box-shadow:none;padding:0;}
  .sticker-img{font-size:80px;line-height:1;display:block;}
  .sticker-bubble .msg-meta{background:#0b141a99;border-radius:8px;padding:1px 5px;position:absolute;bottom:4px;right:4px;margin:0;}

  /* ---------- EMOJI PANEL & STICKER PANEL ---------- */
  .emoji-panel,
  .sticker-panel {
    position: fixed;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: #233138;
    border-radius: 12px;
    padding: 12px;
    display: grid;
    gap: 4px;
    z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    max-height: 320px;
    overflow-y: auto;
  }
  .emoji-panel {
    grid-template-columns: repeat(8, 1fr);
  }
  .sticker-panel {
    grid-template-columns: repeat(4, 1fr);
  }
  .emoji-btn,
  .sticker-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 24px;
    padding: 6px;
    border-radius: 6px;
    transition: background .1s;
  }
  .emoji-btn:hover,
  .sticker-btn:hover {
    background: rgba(255,255,255,0.1);
  }
  .sticker-btn {
    font-size: 48px;
  }

  @media (max-width:820px){
    .sidebar{width:100%;max-width:none;}
    .main{display:none;}
    .app.chat-open .sidebar{display:none;}
    .app.chat-open .main{display:flex;}
    .back-btn{display:flex !important;}
  }
  .back-btn{display:none;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PFX = "waclone_v2_";
  var SESSION_KEY = "waclone_v2_session";
  var POLL_MS = 3000;
  var ONLINE_WINDOW_MS = 10000;

  async function detectBackend(){
    if(window.storage && typeof window.storage.set === "function" && typeof window.storage.get === "function"){
      try{
        var testKey = PFX+"__probe__";
        await window.storage.set(testKey, "1", true);
        var r = await window.storage.get(testKey, true);
        if(r && r.value === "1"){ backend = "claude"; return; }
      }catch(e){ }
    }
    var gotFirebase = await tryFirebaseBackend();
    if(gotFirebase) return;
    var gotKv = await tryKvBackend();
    if(gotKv) return;
    backend = "local";
  }

  async function storeGet(key){
    try{
      if(backend === "claude"){
        var r = await window.storage.get(key, true);
        return r ? JSON.parse(r.value) : null;
      } else if(backend === "firebase"){
        var doc = await fbDb.collection("waclone_data").doc(key).get();
        if(!doc.exists) return null;
        var data = doc.data();
        return (data && data.value !== undefined) ? JSON.parse(data.value) : null;
      } else if(backend === "kv"){
        var raw = await kvGetRaw(key);
        return raw !== null ? JSON.parse(raw) : null;
      } else {
        var v = window.localStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      }
    }catch(e){ return null; }
  }
  async function storeSet(key, val){
    try{
      if(backend === "claude"){
        await window.storage.set(key, JSON.stringify(val), true);
      } else if(backend === "firebase"){
        await fbDb.collection("waclone_data").doc(key).set({ value: JSON.stringify(val) });
      } else if(backend === "kv"){
        await kvSetRaw(key, JSON.stringify(val));
      } else {
        window.localStorage.setItem(key, JSON.stringify(val));
      }
      return true;
    }catch(e){ return false; }
  }

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  async function storeArrayAppendOnce(key, item){
    if(backend === "firebase"){
      try{
        var docRef = fbDb.collection("waclone_data").doc(key);
        await fbDb.runTransaction(async function(tx){
          var snap = await tx.get(docRef);
          var current = (snap.exists && snap.data().value) ? JSON.parse(snap.data().value) : [];
          current.push(item);
          tx.set(docRef, { value: JSON.stringify(current) });
        });
        return true;
      }catch(e){ return false; }
    }
    var arr = (await storeGet(key)) || [];
    arr.push(item);
    return await storeSet(key, arr);
  }
  async function storeArrayAppend(key, item){
    var ok = await storeArrayAppendOnce(key, item);
    if(!ok){ await sleep(900); ok = await storeArrayAppendOnce(key, item); }

  }

  async function storeArrayAppendIfAbsentOnce(key, item, isDuplicateFn){
    if(backend === "firebase"){
      try{
        var docRef = fbDb.collection("waclone_data").doc(key);
        await fbDb.runTransaction(async function(tx){
          var snap = await tx.get(docRef);
          var current = (snap.exists && snap.data().value) ? JSON.parse(snap.data().value) : [];
          if(!current.some(isDuplicateFn)){
            current.push(item);
            tx.set(docRef, { value: JSON.stringify(current) });
          }
        });
        return true;
      }catch(e){ return false; }
    }
    var arr = (await storeGet(key)) || [];
    if(arr.some(isDuplicateFn)) return true;
    arr.push(item);
    return await storeSet(key, arr);
  }
  async function storeArrayAppendIfAbsent(key, item, isDuplicateFn){
    var ok = await storeArrayAppendIfAbsentOnce(key, item, isDuplicateFn);
    if(!ok){ await sleep(900); ok = await storeArrayAppendIfAbsentOnce(key, item, isDuplicateFn); }
    return ok;
  }

  async function storeArrayMutateOnce(key, mutatorFn){
    if(backend === "firebase"){
      try{
        var docRef = fbDb.collection("waclone_data").doc(key);
        await fbDb.runTransaction(async function(tx){
          var snap = await tx.get(docRef);
          var current = (snap.exists && snap.data().value) ? JSON.parse(snap.data().value) : [];
          var changed = mutatorFn(current);
          if(changed){ tx.set(docRef, { value: JSON.stringify(current) }); }
        });
        return true;
      }catch(e){ return false; }
    }
    var arr = (await storeGet(key)) || [];
    var changed = mutatorFn(arr);
    if(changed){ return await storeSet(key, arr); }
    return true;
  }
  async function storeArrayMutate(key, mutatorFn){
    var ok = await storeArrayMutateOnce(key, mutatorFn);
    if(!ok){ await sleep(900); ok = await storeArrayMutateOnce(key, mutatorFn); }
    return ok;
  }

  async function sha256Hex(text){
    try{
      var enc = new TextEncoder().encode(text);
      var buf = await crypto.subtle.digest("SHA-256", enc);
      var arr = Array.from(new Uint8Array(buf));
      return arr.map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }catch(e){
      var h = 0;
      for(var i=0;i<text.length;i++){ h = (h*31 + text.charCodeAt(i)) >>> 0; }
      return "fb"+h.toString(16);
    }
  }

          var side = Math.min(w, h);
          var sx = (w - side) / 2, sy = (h - side) / 2;
          var outSide = Math.min(maxDim, side);
          canvas.width = outSide; canvas.height = outSide;
          ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, side, side, 0, 0, outSide, outSide);
        } else {
          var scale = Math.min(1, maxDim / Math.max(w, h));
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }
        try{ callback(canvas.toDataURL(mimeType, quality)); }catch(e2){ callback(null); }
      };
      img.onerror = function(){ callback(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  async function onGenerateCode(){
    state.loginError = ""; state.loginInfo = "";
    state.loginBusy = true; render();
    var nomor = "8"+randDigits(8);
    var existing = await storeGet(kUser(nomor));
    var tries = 0;
    while(existing && tries<5){ nomor = "8"+randDigits(8); existing = await storeGet(kUser(nomor)); tries++; }
    state.loginBusy = false;
    state.tmpCode = nomor;
    state.loginInfo = "Nomor kamu: "+nomor+" — boleh diubah lagi kalau mau, lalu isi email & nama, dan klik Masuk.";
    render();
  }

  async function onLogin(){
    state.loginError = ""; state.loginInfo = "";
    var email = normEmail(state.tmpEmail);
    var name = (state.tmpName||"").trim();
    var nomor = normCode(state.tmpCode);
    if(!email || !isValidEmail(email)){ state.loginError = "Masukkan email yang valid."; render(); return; }
    state.loginBusy = true; render();

    var emailPtr = await storeGet(kUserByEmail(email));
    var isNewAccount = false;

    if(emailPtr && emailPtr.nomor){
      var profile = await storeGet(kUser(emailPtr.nomor));
      state.myCode = emailPtr.nomor;
      state.myName = (profile && profile.name) ? profile.name : (name || "Pengguna");
    } else {
      if(!name){ state.loginBusy=false; state.loginError = "Email ini belum terdaftar — isi nama tampilan dulu untuk bikin akun baru."; render(); return; }
      if(!nomor){ state.loginBusy=false; state.loginError = "Isi nomor kamu, atau klik \"Buatkan Nomor\"."; render(); return; }
      if(nomor.length < 5){ state.loginBusy=false; state.loginError = "Nomor minimal 5 digit."; render(); return; }
      if(nomor.length > 15){ state.loginBusy=false; state.loginError = "Nomor maksimal 15 digit."; render(); return; }
      var existingNomor = await storeGet(kUser(nomor));
      if(existingNomor){ state.loginBusy=false; state.loginError = "Nomor ini sudah dipakai orang lain, coba nomor lain atau klik \"Buatkan Nomor\"."; render(); return; }
      var ok1 = await storeSet(kUser(nomor), {code:nomor, name:name, email:email, createdAt:Date.now()});
      var ok2 = await storeSet(kUserByEmail(email), {email:email, nomor:nomor});
      if(!ok1 || !ok2){ state.loginBusy=false; state.loginError="Gagal menyimpan akun. Coba lagi."; render(); return; }
      state.myCode = nomor;
      state.myName = name;
      isNewAccount = true;
    }

    await storeSet(kPresence(state.myCode), Date.now());
    await loadUserData();
    saveSession();
    state.loginBusy = false;
    state.screen = "app";
    if(isNewAccount){ state.modal = "profile"; }
    render();
    ensureNotifPermission();
    startPolling();
  }

  async function loadUserData(){
    var contacts = await storeGet(kContacts(state.myCode));
    state.contacts = contacts || [];
    var groupIds = await storeGet(kUserGroups(state.myCode));
    state.groupIds = groupIds || [];
    state.groups = {};
    for(var i=0;i<state.groupIds.length;i++){
      var g = await storeGet(kGroup(state.groupIds[i]));
      if(g) state.groups[g.id] = g;
    }
    var pMap = {};
    for(var j=0;j<state.contacts.length;j++){
      var p = await storeGet(kPresence(state.contacts[j].code));
      if(p) pMap[state.contacts[j].code] = p;
    }
    state.presenceMap = pMap;
    var items = buildChatListItems();
    var lm = {};
    var newIncoming = [];
    var baselineExists = state.notifBaselineSet;
    for(var k=0;k<items.length;k++){
      var arr = await storeGet(kChat(items[k].id));
      if(arr && arr.length){
        var isOpenChat = !!(state.activeChat && state.activeChat.id === items[k].id);
        var lastMsg = arr[arr.length-1];
        if(baselineExists){
          var prevLastMsg = state.lastMsgMap[items[k].id];
          if(lastMsg.from !== state.myCode && (!prevLastMsg || prevLastMsg.ts !== lastMsg.ts) && !isOpenChat){
            newIncoming.push({item: items[k], msg: lastMsg});
          }
        }
        lm[items[k].id] = lastMsg;
      }
    }
    state.lastMsgMap = lm;
    state.notifBaselineSet = true;
    if(newIncoming.length) notifyNewMessages(newIncoming);

    var notes = await storeGet(kNotes(state.myCode));
    state.notes = (notes || []).slice().sort(function(a,b){ return b.ts - a.ts; });

    var now = Date.now();
    var myStatusRaw = await storeGet(kStatus(state.myCode));
    state.myStatuses = (myStatusRaw || []).filter(function(s){ return now - s.ts < STATUS_TTL_MS; });
    var csMap = {};
    for(var s=0;s<state.contacts.length;s++){
      var ccode = state.contacts[s].code;
      var raw = await storeGet(kStatus(ccode));
      var active = (raw || []).filter(function(x){ return now - x.ts < STATUS_TTL_MS; });
      if(active.length) csMap[ccode] = active;
    }
    state.contactStatusesMap = csMap;
  }

  function startPolling(){
    if(state.pollHandle) clearInterval(state.pollHandle);
    state.pollHandle = setInterval(async function(){
      if(state.screen!=="app") return;
      await storeSet(kPresence(state.myCode), Date.now());
      if(state.modal) return;
      await loadUserData();
      updateSidebarPartial();
      if(state.activeChat){
        var oldLen = state.messages.length;
        await refreshMessages();
        if(state.messages.length !== oldLen){
          updateMessagesPartial();
        }
      }
    }, POLL_MS);
  }

      wrap.appendChild(title);
      contactCodes.forEach(function(code){
        var c = state.contacts.filter(function(x){return x.code===code;})[0];
        if(!c) return;
        var list = state.contactStatusesMap[code];
        var unseen = list.some(function(s){ return !(s.viewedBy||[]).includes(state.myCode); });
        var row = document.createElement("div");
        row.className = "status-row";
        row.innerHTML =
          '<div class="status-avatar-wrap"><div class="status-ring'+(unseen?" unseen":"")+'"><div class="avatar md" style="background:'+colorFor(code)+'">'+initials(c.name)+'</div></div></div>'+
          '<div class="chat-item-body">'+
            '<div class="chat-item-name">'+escapeHtml(c.name)+'</div>'+
            '<div class="chat-item-preview">'+fmtTime(list[list.length-1].ts)+'</div>'+
          '</div>';
        row.onclick = function(){ openStatusViewer(code, c.name, list, false); };
        wrap.appendChild(row);
      });

      var empty = document.createElement("div");
      empty.className = "status-empty";
      empty.textContent = "Belum ada status dari kontak kamu.";
      wrap.appendChild(empty);

    setTimeout(function(){
      var badge = document.getElementById("st-add-badge");
      if(badge) badge.onclick = function(e){ e.stopPropagation(); openModal("newStatus"); };
    },0);

    return wrap;
  }

  function openStatusViewer(ownerCode, ownerName, list, isMine){
    state.viewingStatus = {ownerCode:ownerCode, ownerName:ownerName, list:list, index:0, isMine:isMine};
    renderApp();
    markCurrentStatusViewed();
  }
  function closeStatusViewer(){ state.viewingStatus = null; renderApp(); }
  function statusStep(dir){
    var v = state.viewingStatus;
    if(!v) return;
    var next = v.index + dir;
    if(next < 0){ closeStatusViewer(); return; }
    if(next >= v.list.length){ closeStatusViewer(); return; }
    v.index = next;
    renderApp();
    markCurrentStatusViewed();
  }
  async function markCurrentStatusViewed(){
    var v = state.viewingStatus;
    if(!v || v.isMine) return;
    var item = v.list[v.index];
    if((item.viewedBy||[]).includes(state.myCode)) return;
    await storeArrayMutate(kStatus(v.ownerCode), function(arr){
      for(var i=0;i<arr.length;i++){
        if(arr[i].id === item.id){
          arr[i].viewedBy = arr[i].viewedBy || [];
          if(!arr[i].viewedBy.includes(state.myCode)){ arr[i].viewedBy.push(state.myCode); return true; }
        }
      }
      return false;
    });
  }

  function buildStatusViewerOverlay(){
    var v = state.viewingStatus;
    var overlay = document.createElement("div");
    overlay.className = "status-overlay";
    var card = document.createElement("div");
    card.className = "status-card";
    var item = v.list[v.index];
    var segs = v.list.map(function(_,i){ return '<div class="seg'+(i<=v.index?" filled":"")+'"></div>'; }).join("");
    var bodyHtml = item.type === "image"
      ? '<img src="'+item.content+'" style="max-width:100%;max-height:100%;border-radius:8px;"/>'
      : escapeHtml(item.text||"");
    card.innerHTML =
      '<div class="status-progress">'+segs+'</div>'+
      '<div class="status-viewer-header">'+
        '<div class="avatar sm" style="background:'+colorFor(v.ownerCode)+'">'+initials(v.ownerName)+'</div>'+
        '<div class="who"><b>'+escapeHtml(v.ownerName)+'</b><span>'+fmtTime(item.ts)+'</span></div>'+
        '<button id="st-close">'+ICONS.close+'</button>'+
      '</div>'+
      '<div class="status-content" style="'+(item.type!=="image" ? "background:"+(item.bgColor||STATUS_COLORS[0]) : "")+'">'+bodyHtml+'</div>'+
      '<div class="status-nav-zone left" id="st-prev"></div>'+
      '<div class="status-nav-zone right" id="st-next"></div>';
    overlay.appendChild(card);
    overlay.onclick = function(e){ if(e.target===overlay) closeStatusViewer(); };
    setTimeout(function(){
      document.getElementById("st-close").onclick = closeStatusViewer;
      document.getElementById("st-prev").onclick = function(){ statusStep(-1); };
      document.getElementById("st-next").onclick = function(){ statusStep(1); };
    },0);
    return overlay;
  }

  async function saveNewStatus(){
    if(state.modalBusy) return;
    var text = (state.statusTextInput||"").trim();
    if(!text){ state.modalError = "Tulis dulu isi status kamu."; renderApp(); return; }
    state.modalBusy = true; renderApp();
    var item = {id:randCode(10), type:"text", text:text, bgColor:state.statusColor, ts:Date.now(), viewedBy:[]};
    await storeArrayAppend(kStatus(state.myCode), item);
    await loadUserData();
    closeModal();
    toast("Status berhasil dibuat.");

  async function saveNote(){
    if(state.modalBusy) return;
    var text = (state.noteTextInput||"").trim();
    if(!text){ state.modalError = "Tulis dulu isi catatannya."; renderApp(); return; }
    state.modalBusy = true; renderApp();

      await storeArrayMutate(kNotes(state.myCode), function(arr){
        var n = arr.filter(function(x){return x.id===state.editingNoteId;})[0];

        return false;
      });

  function buildFileBubbleContent(m){
    var isImage = (m.fileType||"").indexOf("image/") === 0;
    if(isImage){
      return '<a href="'+m.fileData+'" download="'+escapeHtml(m.fileName)+'" target="_blank" rel="noopener">'+
        '<img class="file-image" src="'+m.fileData+'" alt="'+escapeHtml(m.fileName)+'"/></a>';
    }
    return '<a class="file-chip" href="'+m.fileData+'" download="'+escapeHtml(m.fileName)+'">'+
      '<span class="file-chip-icon">'+ICONS.attach+'</span>'+
      '<span class="file-chip-name">'+escapeHtml(m.fileName)+'</span></a>';
  }

  function buildMessagesInnerHTML(){
    var html = "";
    var lastDay = null;
    state.messages.forEach(function(m){
      var day = fmtDay(m.ts);
      if(day !== lastDay){
        html += '<div class="day-divider">'+escapeHtml(day)+'</div>';
        lastDay = day;
      }
      var isOut = m.from === state.myCode;
      var senderName = (state.activeChat.type==="group" && !isOut) ? (m.fromName || m.from) : "";
      var isFile = m.type === "file";
      var isSticker = m.type === "sticker";
      var bodyHtml;
      if(isFile){
        bodyHtml = buildFileBubbleContent(m);
      } else if(isSticker){
        bodyHtml = '<span class="sticker-img">'+escapeHtml(m.text)+'</span>';
      } else {
        bodyHtml = '<span class="msg-text">'+escapeHtml(m.text)+'</span>';
      }
      var quoteHtml = m.replyTo ? '<div class="reply-quote"><b>'+escapeHtml(m.replyTo.name)+'</b>'+escapeHtml(m.replyTo.preview)+'</div>' : "";
      var actionsHtml =
        '<div class="msg-actions">'+
          '<button class="msg-action-btn" data-reply-id="'+escapeHtml(m.id||"")+'" title="Balas">'+ICONS.reply+'</button>'+
          (isOut ? '<button class="msg-action-btn" data-del-id="'+escapeHtml(m.id||"")+'" title="Hapus">'+ICONS.trash+'</button>' : '')+
        '</div>';
      html +=
        '<div class="msg-row '+(isOut?"out":"in")+'">'+
          '<div class="bubble '+(isOut?"out":"in")+(isFile?" bubble-file":"")+(isSticker?" sticker-bubble":"")+'">'+
            actionsHtml+
            (senderName ? '<span class="sender-tag">'+escapeHtml(senderName)+'</span>' : '')+
            quoteHtml+
            bodyHtml+
            '<div class="msg-meta">'+fmtTime(m.ts)+ (isOut? ' '+checkIconFor(m) : '')+'</div>'+
          '</div>'+
        '</div>';
    });
    return html;
  }

  function wireMessageActions(box){
    if(!box) return;
    box.querySelectorAll("[data-reply-id]").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-reply-id");
        var m = state.messages.filter(function(x){return x.id===id;})[0];
        if(!m) return;
        var isOut = m.from === state.myCode;
        state.replyingTo = {
          id: m.id,
          name: isOut ? "Anda" : (m.fromName || m.from),
          preview: m.type === "file" ? ("📎 "+m.fileName) : (m.type==="sticker" ? "Sticker" : m.text)
        };
        renderApp();
      };
    });
    box.querySelectorAll("[data-del-id]").forEach(function(btn){
      btn.onclick = async function(){
        if(!confirm("Hapus pesan ini untuk semua orang?")) return;
        var id = btn.getAttribute("data-del-id");
        await storeArrayMutate(kChat(state.activeChat.id), function(arr){
          var idx = arr.findIndex(function(x){return x.id===id;});
          if(idx>-1){ arr.splice(idx,1); return true; }
          return false;
        });
        await refreshMessages();
        renderApp();
      };
    });
  }

  async function refreshMessages(){
    if(!state.activeChat) return;
    var chatId = state.activeChat.id;
    await markIncomingDeliveredRead(chatId, true);
    var arr = (await storeGet(kChat(chatId))) || [];
    state.messages = arr;
    if(arr.length) state.lastMsgMap[chatId] = arr[arr.length-1];
  }

    }

    var inputBar = document.createElement("div");

    var draftVal = (state.activeChat && state.draftMessages[state.activeChat.id]) || "";
    inputBar.innerHTML =
      '<button class="icon-btn" id="btn-emoji" '+disabled+' title="Emoji">'+ICONS.emoji+'</button>'+
      '<button class="icon-btn" id="btn-sticker" '+disabled+' title="Stiker">'+ICONS.sticker+'</button>'+
      '<button class="icon-btn" id="btn-attach" '+disabled+' title="Lampiran">'+ICONS.attach+'</button>'+
      '<input id="file-input" type="file" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt,.zip,.rar"/>'+
      '<input id="msg-input" type="text" placeholder="'+(state.activeChat?'Ketik pesan':'Pilih kontak atau grup')+'" value="'+escapeHtml(draftVal)+'" '+disabled+'/>'+
      '<button class="send-btn" id="btn-send" title="Kirim" '+disabled+'>'+ICONS.send+'</button>';

    setTimeout(function(){

      if(back) back.onclick = function(){ state.activeChat = null; state.replyingTo = null; state.headerMenuOpen = false; renderApp(); };
      ["hd-mail","hd-video","hd-phone"].forEach(function(id){

        setTimeout(function(){ document.addEventListener("click", closeHeaderMenuOnce); },0);

          state.headerMenuOpen = false;
          openModal("addMembers", {groupId: state.activeChat.groupId});

        var clearChatBtn = document.getElementById("hm-clear-chat");
        if(clearChatBtn) clearChatBtn.onclick = function(){
          state.headerMenuOpen = false;

        var leaveGroupBtn = document.getElementById("hm-leave-group");
        if(leaveGroupBtn) leaveGroupBtn.onclick = function(){
          state.headerMenuOpen = false;

          if(!confirm("Keluar dari grup \""+it.title+"\"? Grup akan hilang dari daftar kamu (anggota lain tidak terpengaruh).")) return;
          removeChatFromMyList(it);
        };
        var deleteChatBtn = document.getElementById("hm-delete-chat");
        if(deleteChatBtn) deleteChatBtn.onclick = function(){
          state.headerMenuOpen = false;
          var it = state.activeChat;
          if(!confirm("Hapus obrolan dengan \""+it.title+"\" dari daftar kamu?")) return;
          removeChatFromMyList(it);
        };
      }
      if(state.activeChat){
        var chatIdForDraft = state.activeChat.id;
        var input = document.getElementById("msg-input");
        var sendBtn = document.getElementById("btn-send");
        input.oninput = function(e){ state.draftMessages[chatIdForDraft] = e.target.value; };
        function doSend(){
          var txt = input.value.trim();
          if(!txt) return;
          input.value = "";
          delete state.draftMessages[chatIdForDraft];
          var replyTo = state.replyingTo;
          state.replyingTo = null;
          sendMessage(txt, replyTo);
        }
        input.onkeydown = function(e){ if(e.key==="Enter") doSend(); };
        sendBtn.onclick = doSend;
        var caret = input.value.length;
        input.focus();
        input.setSelectionRange(caret, caret);
      }
    },0);

    return el;

  function closeHeaderMenuOnce(){
    state.headerMenuOpen = false;
    document.removeEventListener("click", closeHeaderMenuOnce);
    renderApp();

  async function clearChatMessages(it){
    await storeSet(kChat(it.id), []);
    state.messages = [];
    await loadUserData();
    renderApp();
    toast("Semua pesan di obrolan ini sudah dihapus.");
  }

  async function removeChatFromMyList(it){
    if(it.type === "group"){
      var ug = (await storeGet(kUserGroups(state.myCode))) || [];
      ug = ug.filter(function(id){ return id !== it.groupId; });
      await storeSet(kUserGroups(state.myCode), ug);
    } else {
      var myContacts = (await storeGet(kContacts(state.myCode))) || [];
      myContacts = myContacts.filter(function(c){ return c.code !== it.code; });
      await storeSet(kContacts(state.myCode), myContacts);
    }
    if(state.activeChat && state.activeChat.id === it.id){ state.activeChat = null; }
    await loadUserData();
    renderApp();
    toast(it.type === "group" ? "Kamu keluar dari grup." : "Obrolan dihapus dari daftar kamu.");
  }

  var MAX_FILE_BYTES = 700 * 1024;

  function handleFileSelected(f){
    if(!state.activeChat) return;
    if(f.size > MAX_FILE_BYTES){
      toast("File terlalu besar (maks sekitar 700KB). Coba kompres dulu atau pilih file lain.");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){ sendFileMessage(f.name, f.type, e.target.result); };
    reader.onerror = function(){ toast("Gagal membaca file."); };
    reader.readAsDataURL(f);
  }

  async function sendFileMessage(fileName, fileType, dataUrl){
    var chat = state.activeChat;
    var replyTo = state.replyingTo; state.replyingTo = null;
    var msg = {id:randCode(10), from:state.myCode, fromName:state.myName, ts:Date.now(), delivered:false, read:false,
      type:"file", fileName:fileName, fileType:fileType||"", fileData:dataUrl, text:"", replyTo:replyTo||null};
    state.messages.push(msg);
    renderApp();
    var ok = await storeArrayAppend(kChat(chat.id), msg);
    if(!ok){ toast("Gagal mengirim file. Kemungkinan ukuran riwayat chat ini sudah penuh, atau jaringan bermasalah."); }
    refreshMessages().then(renderApp);
  }

  async function sendMessage(text, replyTo){
    var chat = state.activeChat;
    var msg = {id:randCode(10), from:state.myCode, fromName:state.myName, text:text, ts:Date.now(), delivered:false, read:false, replyTo:replyTo||null};
    state.messages.push(msg);
    renderApp();
    var ok = await storeArrayAppend(kChat(chat.id), msg);
    if(!ok){ toast("Gagal mengirim pesan (jaringan bermasalah). Coba kirim lagi."); }
    refreshMessages().then(renderApp);
  }

  /* ---------- EMOJI & STICKER PANELS ---------- */
  function openEmojiPanel(){
    if(!state.activeChat) return;
    if(document.querySelector(".emoji-panel")) return;

    var panel = document.createElement("div");
    panel.className = "emoji-panel";

    EMOJIS.forEach(function(emoji){
      var btn = document.createElement("button");
      btn.className = "emoji-btn";
      btn.textContent = emoji;
      btn.onclick = function(){
        var input = document.getElementById("msg-input");
        if(input){
          input.value += emoji;
          state.draftMessages[state.activeChat.id] = input.value;
          input.focus();
        }
        panel.remove();
        document.removeEventListener("click", closePanelHandler);
      };
      panel.appendChild(btn);
    });

    document.body.appendChild(panel);

    function closePanelHandler(e){
      if(!panel.contains(e.target)){
        panel.remove();
        document.removeEventListener("click", closePanelHandler);
      }
    }
    setTimeout(function(){
      document.addEventListener("click", closePanelHandler);
    },0);
  }

  function openStickerPanel(){
    if(!state.activeChat) return;
    if(document.querySelector(".sticker-panel")) return;

    var panel = document.createElement("div");
    panel.className = "sticker-panel";

    STICKERS.forEach(function(emoji){
      var btn = document.createElement("button");
      btn.className = "sticker-btn";
      btn.textContent = emoji;
      btn.onclick = function(){
        sendSticker(emoji);
        panel.remove();
        document.removeEventListener("click", closePanelHandler);
      };
      panel.appendChild(btn);
    });

    document.body.appendChild(panel);

    function closePanelHandler(e){
      if(!panel.contains(e.target)){
        panel.remove();
        document.removeEventListener("click", closePanelHandler);
      }
    }
    setTimeout(function(){
      document.addEventListener("click", closePanelHandler);
    },0);
  }

  async function sendSticker(emoji){
    var chat = state.activeChat;
    var replyTo = state.replyingTo; state.replyingTo = null;
    var msg = {
      id: randCode(10),
      from: state.myCode,
      fromName: state.myName,
      text: emoji,
      ts: Date.now(),
      delivered: false,
      read: false,
      type: "sticker",
      replyTo: replyTo || null
    };
    state.messages.push(msg);
    renderApp();
    var ok = await storeArrayAppend(kChat(chat.id), msg);
    if(!ok){
      toast("Gagal mengirim sticker. Jaringan bermasalah?");
    }
    refreshMessages().then(renderApp);
  }

  /* ---------- Modals ---------- */
  function openModal(name, ctx){
    state.modal = name;
    state.modalError = "";
    state.modalBusy = false;
    state.pickCode = "";
    state.groupNameInput = "";
    state.groupPicked = {};
    if(name === "newStatus"){
      state.statusTextInput = "";
      state.statusColor = STATUS_COLORS[0];
    }
    if(name === "addMembers"){
      state.modalGroupId = ctx && ctx.groupId;
    }
    renderApp();
  }
  function closeModal(){ state.modal = null; state.modalBusy = false; renderApp(); }

  function buildModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.onclick = function(e){ if(e.target===overlay) closeModal(); };

    var modal = document.createElement("div");
    modal.className = "modal";

    if(state.modal === "addContact"){
      modal.innerHTML =
        '<div class="modal-header"><span>Tambah Kontak</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>Nomor kontak</label>'+
            '<input id="add-code" type="text" inputmode="numeric" placeholder="Masukkan nomor teman" value="'+escapeHtml(state.pickCode)+'"/></div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<div class="muted-note">Minta nomor WhatsApp temanmu, lalu masukkan di sini. Setelah ditambahkan, obrolan langsung muncul untuk kalian berdua.</div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save" '+(state.modalBusy?"disabled":"")+'>Tambah</button></div>';
    } else if(state.modal === "newGroup"){
      var rows = state.contacts.map(function(c){
        var checked = state.groupPicked[c.code] ? "checked" : "";
        return '<label class="contact-pick-row"><input type="checkbox" data-code="'+escapeHtml(c.code)+'" class="grp-pick" '+checked+'/>'+
          '<div class="avatar sm" style="background:'+colorFor(c.code)+'">'+initials(c.name)+'</div><div>'+escapeHtml(c.name)+' <span style="color:#8696a0;font-size:12px">#'+escapeHtml(c.code)+'</span></div></label>';
      }).join("");
      modal.innerHTML =
        '<div class="modal-header"><span>Grup Baru</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>Nama grup</label><input id="grp-name" type="text" placeholder="Misal: Tim Proyek" value="'+escapeHtml(state.groupNameInput)+'"/></div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<label style="font-size:12.5px;color:var(--text-muted);display:block;margin:14px 0 4px;">Pilih anggota</label>'+
          (state.contacts.length ? rows : '<div class="muted-note">Tambahkan kontak dulu sebelum membuat grup.</div>')+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save" '+(state.modalBusy?"disabled":"")+'>Buat Grup</button></div>';
    } else if(state.modal === "profile"){
      modal.innerHTML =
        '<div class="modal-header"><span>Profil Saya</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body" style="text-align:center;">'+
          '<div class="avatar lg" style="margin:0 auto 14px;background:'+colorFor(state.myCode)+'">'+initials(state.myName)+'</div>'+
          '<div style="font-size:17px;font-weight:600;margin-bottom:4px;">'+escapeHtml(state.myName)+'</div>'+
          '<div class="muted-note" style="margin-bottom:14px;">Nomor ini fungsinya seperti nomor telepon di WhatsApp asli — simpan baik-baik, dan bagikan ke orang lain supaya mereka bisa menambahkanmu sebagai kontak. Login berikutnya cukup pakai email kamu.</div>'+
          '<div class="copy-row"><div class="code-generated">'+escapeHtml(state.myCode)+'</div><button class="btn btn-secondary" id="m-copy">Salin</button></div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-logout">Keluar</button><button class="btn btn-primary" id="m-cancel">Tutup</button></div>';
    } else if(state.modal === "newStatus"){
      var swatches = STATUS_COLORS.map(function(c){
        return '<div class="color-swatch'+(state.statusColor===c?" selected":"")+'" data-color="'+c+'" style="background:'+c+'"></div>';
      }).join("");
      modal.innerHTML =
        '<div class="modal-header"><span>Buat Status Teks</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="status-text-preview" id="st-preview" style="background:'+state.statusColor+'">'+(escapeHtml(state.statusTextInput)||"Tulis sesuatu...")+'</div>'+
          '<div class="field" style="margin-top:14px;"><label>Isi status</label><textarea id="st-text" class="status-textarea" maxlength="140" placeholder="Apa yang sedang kamu pikirkan?">'+escapeHtml(state.statusTextInput)+'</textarea></div>'+
          '<label style="font-size:12.5px;color:var(--text-muted);">Warna latar</label>'+
          '<div class="color-swatch-row">'+swatches+'</div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<div class="muted-note">Status akan otomatis hilang setelah 24 jam, dan hanya terlihat oleh kontakmu.</div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save" '+(state.modalBusy?"disabled":"")+'>Bagikan</button></div>';
    } else if(state.modal === "editNote"){
      modal.innerHTML =
        '<div class="modal-header"><span>'+(state.editingNoteId?"Edit Catatan":"Catatan Baru")+'</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>Isi catatan</label><textarea id="note-text" class="status-textarea" style="min-height:120px;" placeholder="Tulis catatan pribadi kamu di sini...">'+escapeHtml(state.noteTextInput)+'</textarea></div>'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          '<div class="muted-note">Catatan ini bersifat pribadi, tidak dikirim ke siapapun.</div>'+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save" '+(state.modalBusy?"disabled":"")+'>Simpan</button></div>';
    } else if(state.modal === "addMembers"){
      var grp = state.groups[state.modalGroupId];
      var candidates = state.contacts.filter(function(c){ return !grp || grp.members.indexOf(c.code) === -1; });
      var rows2 = candidates.map(function(c){
        var checked = state.groupPicked[c.code] ? "checked" : "";
        return '<label class="contact-pick-row"><input type="checkbox" data-code="'+escapeHtml(c.code)+'" class="grp-pick" '+checked+'/>'+
          '<div class="avatar sm" style="background:'+colorFor(c.code)+'">'+initials(c.name)+'</div><div>'+escapeHtml(c.name)+' <span style="color:#8696a0;font-size:12px">#'+escapeHtml(c.code)+'</span></div></label>';
      }).join("");
      modal.innerHTML =
        '<div class="modal-header"><span>Tambah Anggota</span><button id="m-close">'+ICONS.close+'</button></div>'+
        '<div class="modal-body">'+
          (state.modalError ? '<div class="err-msg">'+escapeHtml(state.modalError)+'</div>' : '')+
          (candidates.length ? rows2 : '<div class="muted-note">Semua kontak kamu sudah ada di grup ini, atau kamu belum punya kontak lain.</div>')+
        '</div>'+
        '<div class="modal-footer"><button class="btn btn-secondary" id="m-cancel">Batal</button><button class="btn btn-primary" id="m-save" '+(state.modalBusy?"disabled":"")+'>Tambahkan</button></div>';
    }

    overlay.appendChild(modal);

    setTimeout(function(){
      var close = document.getElementById("m-close"); if(close) close.onclick = closeModal;
      var cancel = document.getElementById("m-cancel"); if(cancel) cancel.onclick = closeModal;

      if(state.modal === "addContact"){
        var input = document.getElementById("add-code");
        input.oninput = function(e){ state.pickCode = e.target.value; };
        input.onkeydown = function(e){ if(e.key==="Enter") saveAddContact(); };
        document.getElementById("m-save").onclick = saveAddContact;
        input.focus();
      } else if(state.modal === "newGroup"){
        var nameInput = document.getElementById("grp-name");
        if(nameInput) nameInput.oninput = function(e){ state.groupNameInput = e.target.value; };
        document.querySelectorAll(".grp-pick").forEach(function(cb){
          cb.onchange = function(e){ state.groupPicked[e.target.getAttribute("data-code")] = e.target.checked; };
        });
        document.getElementById("m-save").onclick = saveNewGroup;
      } else if(state.modal === "profile"){
        var copyBtn = document.getElementById("m-copy");
        if(copyBtn) copyBtn.onclick = function(){
          try{
            navigator.clipboard.writeText(state.myCode);
            copyBtn.textContent = "Tersalin!";
            setTimeout(function(){ copyBtn.textContent = "Salin"; },1500);
          }catch(e){ toast("Tidak bisa menyalin otomatis, salin manual ya."); }
        };
        var logoutBtn = document.getElementById("m-logout");
        if(logoutBtn) logoutBtn.onclick = function(){
          if(!confirm("Keluar dari akun ini? Kamu perlu login lagi nanti.")) return;
          clearSession();
          if(state.pollHandle) clearInterval(state.pollHandle);
          location.reload();
        };
      } else if(state.modal === "newStatus"){
        var stText = document.getElementById("st-text");
        var stPreview = document.getElementById("st-preview");
        stText.oninput = function(e){
          state.statusTextInput = e.target.value;
          if(stPreview) stPreview.textContent = e.target.value || "Tulis sesuatu...";
        };
        document.querySelectorAll(".color-swatch").forEach(function(sw){
          sw.onclick = function(){
            state.statusColor = sw.getAttribute("data-color");
            document.querySelectorAll(".color-swatch").forEach(function(s){ s.classList.remove("selected"); });
            sw.classList.add("selected");
            if(stPreview) stPreview.style.background = state.statusColor;
          };
        });
        document.getElementById("m-save").onclick = saveNewStatus;
        stText.focus();
      } else if(state.modal === "editNote"){
        var noteText = document.getElementById("note-text");
        noteText.oninput = function(e){ state.noteTextInput = e.target.value; };
        document.getElementById("m-save").onclick = saveNote;
        noteText.focus();
      } else if(state.modal === "addMembers"){
        document.querySelectorAll(".grp-pick").forEach(function(cb){
          cb.onchange = function(e){ state.groupPicked[e.target.getAttribute("data-code")] = e.target.checked; };
        });
        document.getElementById("m-save").onclick = saveAddMembers;
      }
    },0);

    return overlay;
  }

  async function saveAddContact(){
    if(state.modalBusy) return;
    var code = normCode(state.pickCode);
    if(!code){ state.modalError = "Masukkan nomor terlebih dulu."; renderApp(); return; }
    if(code === state.myCode){ state.modalError = "Tidak bisa menambahkan nomor sendiri."; renderApp(); return; }
    if(state.contacts.some(function(c){return c.code===code;})){ state.modalError = "Kontak ini sudah ada."; renderApp(); return; }
    state.modalBusy = true;
    state.modalError = "Mencari nomor...";
    renderApp();
    var target = await storeGet(kUser(code));
    if(!target){
      state.modalBusy = false;
      state.modalError = backend==="local"
        ? "Nomor tidak ditemukan di penyimpanan lokal ini. Di mode lokal, nomor hanya dikenali di browser yang sama."
        : "Nomor tidak ditemukan. Pastikan nomor benar.";
      renderApp(); return;
    }

    await storeArrayAppendIfAbsent(kContacts(state.myCode), {code:code, name:target.name}, function(c){ return c.code===code; });
    await storeArrayAppendIfAbsent(kContacts(code), {code:state.myCode, name:state.myName}, function(c){ return c.code===state.myCode; });

    await loadUserData();
    closeModal();
  }

  async function saveNewGroup(){
    if(state.modalBusy) return;
    var name = (state.groupNameInput||"").trim();
    var picked = Object.keys(state.groupPicked).filter(function(c){return state.groupPicked[c];});
    if(!name){ state.modalError = "Beri nama grupnya dulu."; renderApp(); return; }
    if(picked.length < 1){ state.modalError = "Pilih minimal satu anggota."; renderApp(); return; }
    state.modalBusy = true;
    state.modalError = "";
    renderApp();
    var id = randCode(8);
    var members = picked.slice();
    members.push(state.myCode);
    var group = {id:id, name:name, members:members, createdBy:state.myCode, createdAt:Date.now()};
    await storeSet(kGroup(id), group);
    for(var i=0;i<members.length;i++){
      var mCode = members[i];
      await storeArrayAppendIfAbsent(kUserGroups(mCode), id, function(existingId){ return existingId === id; });
    }
    await loadUserData();
    closeModal();
  }

  async function saveAddMembers(){
    if(state.modalBusy) return;
    var picked = Object.keys(state.groupPicked).filter(function(c){return state.groupPicked[c];});
    if(picked.length < 1){ state.modalError = "Pilih minimal satu kontak untuk ditambahkan."; renderApp(); return; }
    state.modalBusy = true; state.modalError = ""; renderApp();
    var groupId = state.modalGroupId;
    var grp = await storeGet(kGroup(groupId));
    if(!grp){ state.modalBusy=false; state.modalError="Grup tidak ditemukan."; renderApp(); return; }
    picked.forEach(function(code){
      if(grp.members.indexOf(code) === -1) grp.members.push(code);
    });
    await storeSet(kGroup(groupId), grp);
    for(var i=0;i<picked.length;i++){
      await storeArrayAppendIfAbsent(kUserGroups(picked[i]), groupId, function(existingId){ return existingId === groupId; });
    }
    await loadUserData();
    if(state.activeChat && state.activeChat.type === "group" && state.activeChat.groupId === groupId){
      var updated = state.groups[groupId];
      if(updated) state.activeChat.sub = updated.members.length+" anggota";
    }
    closeModal();
    toast("Anggota berhasil ditambahkan.");
  }

  /* ============== BOOT ============== */
  async function tryAutoLogin(){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){}
    if(saved && saved.code){
      var profile = await storeGet(kUser(saved.code));
      if(profile){
        state.myCode = saved.code;
        state.myName = profile.name || "Pengguna";
        await storeSet(kPresence(state.myCode), Date.now());
        await loadUserData();
        state.screen = "app";
        render();
        ensureNotifPermission();
        startPolling();
        return;
      }
      clearSession();
    }
    state.screen = "login";
    render();
  }

  render();
  detectBackend().then(function(){
    return tryAutoLogin();
  });
})();
</script>
</body>
</html>
