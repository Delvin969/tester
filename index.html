<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>FreeWord - Editor Dokumen Gratis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #d6d6d6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ribbon {
    background: linear-gradient(#f3f3f3, #e6e6e6);
    border-bottom: 1px solid #c8c8c8;
    padding: 8px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    border-right: 1px solid #d0d0d0;
    flex-wrap: wrap;
  }
  .group:last-child { border-right: none; }
  button {
    background: #fff;
    border: 1px solid #c8c8c8;
    border-radius: 3px;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 13px;
    min-width: 28px;
  }
  button:hover { background: #e3f0fd; border-color: #2b7de9; }
  button:active { background: #cfe4fb; }
  select, input[type="color"], input[type="number"] {
    border: 1px solid #c8c8c8;
    border-radius: 3px;
    padding: 4px;
    font-size: 13px;
    background: #fff;
  }
  input[type="color"] { width: 32px; height: 28px; padding: 2px; cursor: pointer; }
  input[type="number"] { width: 50px; }
  .mini-label { font-size: 11px; color: #555; }
  #tabbar {
    display: flex;
    gap: 2px;
    background: #f3f3f3;
    padding: 6px 10px 0;
    border-bottom: 1px solid #c8c8c8;
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-radius: 4px 4px 0 0;
    padding: 7px 18px;
    font-size: 13px;
    cursor: pointer;
    color: #444;
  }
  .tab-btn:hover { background: #e3f0fd; }
  .tab-btn.active {
    background: #fff;
    color: #2b579a;
    font-weight: 600;
    border: 1px solid #c8c8c8;
    border-bottom: 1px solid #fff;
    margin-bottom: -1px;
  }
  .tab-btn.file-tab {
    background: #2b579a;
    color: white;
    font-weight: 600;
  }
  .tab-btn.file-tab:hover { background: #1e4173; }
  #backstage {
    display: none;
    position: fixed;
    inset: 0;
    background: #2b579a;
    z-index: 999;
    color: white;
  }
  #backstage.show { display: flex; }
  #backstage-sidebar {
    width: 220px;
    background: #1e4173;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  #backstage-sidebar button {
    background: transparent;
    border: none;
    color: white;
    text-align: left;
    padding: 12px 24px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  #backstage-sidebar button:hover { background: #2b579a; }
  #backstage-sidebar button.active { background: #f3f3f3; color: #1e4173; font-weight: 600; }
  #backstage-main {
    flex: 1;
    background: #f3f3f3;
    color: #222;
    padding: 30px 50px;
    overflow-y: auto;
  }
  #backstage-main h1 { font-weight: 400; margin-top: 0; }
  .template-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 20px 0 30px; }
  .template-card {
    width: 140px;
    cursor: pointer;
    text-align: center;
  }
  .template-card .thumb {
    width: 140px;
    height: 180px;
    background: white;
    border: 1px solid #ccc;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #999;
  }
  .template-card:hover .thumb { border-color: #2b7de9; }
  .recent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .recent-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ccc; color: #555; font-weight: 600; }
  .recent-table td { padding: 8px; border-bottom: 1px solid #e0e0e0; }
  .recent-table tr:hover { background: #e8f0fe; cursor: pointer; }
  .ribbon-panel { display: none; }
  .ribbon-panel.active { display: flex; }
  .textbox {
    display: inline-block;
    min-width: 120px;
    min-height: 40px;
    border: 1px dashed #888;
    padding: 8px;
    margin: 4px;
    resize: both;
    overflow: auto;
    vertical-align: top;
    cursor: move;
  }
  #tableToolbar {
    position: fixed;
    display: none;
    align-items: center;
    gap: 8px;
    background: #333;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 500;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  #tableToolbar.show { display: flex; }
  #tableToolbar button {
    background: #555;
    color: white;
    border: none;
    padding: 4px 8px;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  #tableToolbar button:hover { background: #d9534f; }
  #tableToolbar input[type="color"] { width: 24px; height: 24px; padding: 0; border: none; cursor: pointer; }
  #tableToolbar .drag-hint { cursor: grab; font-size: 15px; touch-action: none; user-select: none; }
  .shape-rect { display:inline-block; width:120px; height:80px; border:2px solid #333; margin:4px; vertical-align:middle; }
  .shape-circle { display:inline-block; width:90px; height:90px; border:2px solid #333; border-radius:50%; margin:4px; vertical-align:middle; }
  .shape-line { display:block; width:200px; height:0; border-top:2px solid #333; margin:12px 4px; }
  .page-header-area {
    font-size: 10px;
    color: #888;
    text-align: center;
    padding-bottom: 6px;
    margin-bottom: 10px;
    border-bottom: 1px solid #ddd;
    outline: none;
    min-height: 14px;
  }
  #statusbar {
    background: #2b579a;
    color: white;
    font-size: 12px;
    padding: 4px 14px;
    display: flex;
    justify-content: space-between;
  }
  #page-wrap {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 30px 0 80px;
  }
  .page-wrapper { position: relative; margin-bottom: 20px; }
  .page {
    background: white;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
    font-size: 12pt;
    line-height: 1.5;
    outline: none;
    color: #111;
  }
  .page-label {
    position: absolute;
    top: -22px;
    left: 0;
    font-size: 11px;
    color: #777;
  }
  .page-footer {
    text-align: right;
    font-size: 10px;
    color: #999;
    margin: 4px 2px 0;
  }
  .add-page-under {
    display: block;
    margin: 6px auto 0;
    background: #fff;
    border: 1px dashed #999;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 12px;
    color: #444;
    cursor: pointer;
  }
  .add-page-under:hover { background: #e3f0fd; border-color: #2b7de9; }
  .page img { max-width: 100%; }
  .page table { border-collapse: collapse; margin: 10px 0; }
  .page table td, .page table th { border: 1px solid #999; padding: 6px 10px; min-width: 60px; }
  .page h1 { font-size: 24pt; font-weight: 600; margin: 0.6em 0 0.3em; }
  .page h2 { font-size: 18pt; font-weight: 600; margin: 0.6em 0 0.3em; }

  #fileInput, #imageInput { display: none; }
  #toast {

    background: #333; color: white; padding: 10px 18px; border-radius: 6px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;

    body { background: white; }
    #page-wrap { padding: 0; gap: 0; }
    .page-wrapper { margin-bottom: 0; page-break-after: always; }
    .page { box-shadow: none; }
  }
</style>
</head>

<script>
const pageWrap = document.getElementById('page-wrap');
const statusText = document.getElementById('statusText');
const wordCount = document.getElementById('wordCount');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// --- Ukuran kertas (px @ 96dpi) ---
const paperSizesPx = {
  A4: { width: 794, minHeight: 1123 },
  Letter: { width: 816, minHeight: 1056 },
  Legal: { width: 816, minHeight: 1344 },
  F4: { width: 793, minHeight: 1247 },
};
let currentMarginPx = { top: 96, right: 96, bottom: 96, left: 96 }; // 2.54cm default
let lastFocusedPage = null;

// Each toolbar control that needs a text selection gets its OWN tracker,
// so applying font size doesn't stomp on the range line-spacing needs (and
// vice versa) -- that cross-contamination was why line spacing looked broken.
function createSelectionTracker() {
  let range = null;
  function capture() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    if (r.collapsed) return;
    const node = r.commonAncestorContainer;
    const el = node.nodeType === 3 ? node.parentElement : node;
    if (el && el.closest && el.closest('.page')) {
      range = r.cloneRange();
    }
  }
  return { capture, get: () => range, set: (r) => { range = r; } };
}

const fontSizeTracker = createSelectionTracker();
const lineSpacingTracker = createSelectionTracker();
const textCaseTracker = createSelectionTracker();
const trackers = [fontSizeTracker, lineSpacingTracker, textCaseTracker];
function captureAllTrackers() { trackers.forEach(t => t.capture()); }

function attachSelectionCapture(el, tracker) {
  el.addEventListener('mousedown', tracker.capture);
  el.addEventListener('focus', tracker.capture);
}

function closestPageFromRange(range) {
  const node = range.commonAncestorContainer;
  const el = node.nodeType === 3 ? node.parentElement : node;
  return el ? el.closest('.page') : null;
}

function toPx(value, unit) {
  if (unit === 'in') return Math.round(value * 96);
  return Math.round(value * 37.795); // cm
}

function applyPageSettingsToAll() {
  const size = paperSizesPx[document.getElementById('paperSize').value];
  const m = currentMarginPx;
  document.querySelectorAll('.page').forEach(p => {
    p.style.width = size.width + 'px';
    p.style.minHeight = size.minHeight + 'px';
    p.style.padding = `${m.top}px ${m.right}px ${m.bottom}px ${m.left}px`;
  });
  document.querySelectorAll('.page-footer').forEach(f => { f.style.width = size.width + 'px'; });
}

document.getElementById('paperSize').addEventListener('change', applyPageSettingsToAll);

document.getElementById('applyMarginBtn').addEventListener('click', () => {
  const unit = document.getElementById('marginUnit').value;
  const top = parseFloat(document.getElementById('marginTop').value);
  const bottom = parseFloat(document.getElementById('marginBottom').value);
  const left = parseFloat(document.getElementById('marginLeft').value);
  const right = parseFloat(document.getElementById('marginRight').value);
  if ([top, bottom, left, right].some(v => isNaN(v) || v < 0)) {
    alert('Masukkan angka margin yang valid di semua kolom.');
    return;
  }
  currentMarginPx = { top: toPx(top, unit), bottom: toPx(bottom, unit), left: toPx(left, unit), right: toPx(right, unit) };
  applyPageSettingsToAll();
  showToast(`Margin diterapkan (${unit === 'in' ? 'inci' : 'cm'}): atas ${top}, bawah ${bottom}, kiri ${left}, kanan ${right}`);
});

// --- Halaman ---
function createPage(initialHtml, afterWrapper) {
  const wrapper = document.createElement('div');
  wrapper.className = 'page-wrapper';

  const label = document.createElement('div');
  label.className = 'page-label';
  wrapper.appendChild(label);

  const size = paperSizesPx[document.getElementById('paperSize').value];
  const m = currentMarginPx;
  const page = document.createElement('div');
  page.className = 'page';
  page.contentEditable = 'true';
  page.spellcheck = true;
  page.style.width = size.width + 'px';
  page.style.minHeight = size.minHeight + 'px';
  page.style.padding = `${m.top}px ${m.right}px ${m.bottom}px ${m.left}px`;
  page.innerHTML = initialHtml || '<p><br></p>';
  wrapper.appendChild(page);

  const footer = document.createElement('div');
  footer.className = 'page-footer';
  footer.style.width = size.width + 'px';
  wrapper.appendChild(footer);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-page-under';
  addBtn.textContent = '+ Tambah Halaman Baru di Sini';
  wrapper.appendChild(addBtn);

  if (afterWrapper && afterWrapper.nextSibling) {
    pageWrap.insertBefore(wrapper, afterWrapper.nextSibling);
  } else {
    pageWrap.appendChild(wrapper);
  }
  renumberPages();
  return page;
}

function renumberPages() {
  const wrappers = document.querySelectorAll('.page-wrapper');
  const total = wrappers.length;
  wrappers.forEach((w, i) => {
    w.querySelector('.page-label').textContent = 'Halaman ' + (i + 1);
    const footer = w.querySelector('.page-footer');
    const custom = footer.dataset.customText;
    footer.textContent = custom ? `${custom} — Halaman ${i + 1} dari ${total}` : `Halaman ${i + 1} dari ${total}`;
  });
}

function getAllPages() {
  return Array.from(document.querySelectorAll('.page'));
}

// =====================================================================
// UNDO / REDO — snapshot seluruh isi dokumen, jadi SEMUA aksi (ketik,
// insert tabel/gambar/shape, ubah warna, hapus, dsb) bisa di-undo, bukan
// cuma yang tercatat oleh undo bawaan browser.
// =====================================================================
let undoStack = [];
let redoStack = [];
let lastSnapshot = null;
let snapshotDebounce = null;

function commitNow() {
  clearTimeout(snapshotDebounce);
  const current = pageWrap.innerHTML;
  if (lastSnapshot !== null && current !== lastSnapshot) {
    undoStack.push(lastSnapshot);
    if (undoStack.length > 150) undoStack.shift();
    redoStack = [];
  }
  lastSnapshot = current;
}

function scheduleSnapshot() {
  clearTimeout(snapshotDebounce);
  snapshotDebounce = setTimeout(commitNow, 500);
}

function restoreSnapshot(html) {
  pageWrap.innerHTML = html;
  lastSnapshot = html;
  renumberPages();
  updateWordCount();
  tableToolbar.classList.remove('show');
  activeTable = null;
}

function performUndo() {
  commitNow();
  if (undoStack.length === 0) { showToast('Tidak ada lagi yang bisa di-undo.'); return; }
  redoStack.push(lastSnapshot);
  restoreSnapshot(undoStack.pop());
}

function performRedo() {
  if (redoStack.length === 0) { showToast('Tidak ada lagi yang bisa di-redo.'); return; }
  undoStack.push(lastSnapshot);
  restoreSnapshot(redoStack.pop());
}

// Delegated listeners on pageWrap — these survive undo/redo's innerHTML

pageWrap.addEventListener('focusin', (e) => {

  if (page) lastFocusedPage = page;
});
pageWrap.addEventListener('input', (e) => {

});

    const p = createPage('<p><br></p>', wrapper);
    commitNow();
    p.focus();
    p.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

// =====================================================================
// GESER TABEL & SHAPE — pakai Pointer Events, bukan drag HTML5.
// Drag HTML5 bawaan browser umumnya TIDAK berfungsi di layar sentuh
// (HP/tablet), jadi tabel/shape terasa "tidak bisa dipindah" di HP.
// Pointer Events menyatukan mouse & sentuhan sehingga geser tetap jalan
// di kedua jenis perangkat.
// =====================================================================
let ptrDrag = null; // { el }

function beginPointerDrag(el, e) {
  e.preventDefault();
  ptrDrag = { el };
  el.style.opacity = '0.45';
  if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
}

function dropElementAtPoint(el, clientX, clientY) {
  let range = null;
  if (document.caretRangeFromPoint) {
    range = document.caretRangeFromPoint(clientX, clientY);
  } else if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(clientX, clientY);
    if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); }
  }
  if (range) {
    el.remove();
    range.insertNode(el);
    return true;
  }
  return false;
}

// Pegangan "⠿ Seret tabel" di toolbar tabel -> mulai geser tabel aktif
document.querySelector('#tableToolbar .drag-hint').addEventListener('pointerdown', (e) => {
  if (!activeTable) return;
  beginPointerDrag(activeTable, e);
});

// Sentuh/klik langsung pada shape (kotak, panah, dst.) -> mulai geser shape itu
pageWrap.addEventListener('pointerdown', (e) => {
  const shape = e.target.closest('.shape-block');
  if (shape) beginPointerDrag(shape, e);
});

document.addEventListener('pointerup', (e) => {
  if (!ptrDrag) return;
  const el = ptrDrag.el;
  el.style.opacity = '';
  commitNow();
  dropElementAtPoint(el, e.clientX, e.clientY);
  commitNow();
  ptrDrag = null;
  updateWordCount();
});
document.addEventListener('pointercancel', () => {
  if (ptrDrag) { ptrDrag.el.style.opacity = ''; ptrDrag = null; }
});

// Drag HTML5 klasik disisakan untuk Text Box saja (masih berguna di desktop;
// mengetik di dalam text box butuh fokus normal, jadi tidak dipindah ke
// pointerdown supaya tidak bentrok dengan penempatan kursor teks).
pageWrap.addEventListener('dragstart', (e) => {
  const el = e.target.closest('.textbox');
  if (el) { draggedEl = el; e.dataTransfer.effectAllowed = 'move'; }
});
pageWrap.addEventListener('dragover', (e) => {
  if (draggedEl) e.preventDefault();
});
pageWrap.addEventListener('drop', (e) => {
  if (!draggedEl) return;
  e.preventDefault();
  commitNow();
  dropElementAtPoint(draggedEl, e.clientX, e.clientY);
  commitNow();
  draggedEl = null;
  updateWordCount();
});

// Ctrl+Z / Ctrl+Y (atau Ctrl+Shift+Z) untuk undo/redo custom kita
document.addEventListener('keydown', (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); performUndo(); }
  else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); performRedo(); }
});

  const savedRange = fontSizeTracker.get();
  if (!savedRange) { alert('Blok/pilih teks dulu (dengan mouse) sebelum mengubah ukuran huruf.'); return; }
  try {
    const span = document.createElement('span');
    span.style.fontSize = pt + 'pt';
    const contents = savedRange.extractContents();
    span.appendChild(contents);
    savedRange.insertNode(span);
    const page = span.closest ? span.closest('.page') : null;
    if (page) { lastFocusedPage = page; page.focus(); }
    const sel = window.getSelection();
    sel.removeAllRanges();
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.addRange(newRange);
    fontSizeTracker.set(newRange.cloneRange());
    updateWordCount();

attachSelectionCapture(document.getElementById('lineSpacing'), lineSpacingTracker);
document.getElementById('lineSpacing').addEventListener('change', (e) => {
  const val = e.target.value;
  let range = lineSpacingTracker.get();
  if (!range) {
    const page = lastFocusedPage || document.querySelector('.page');
    if (!page) return;
    const sel = window.getSelection();
    if (sel.rangeCount) range = sel.getRangeAt(0);
  }
  if (!range) { alert('Klik di dalam paragraf dulu sebelum mengubah spasi baris.'); return; }
  const page = closestPageFromRange(range);
  if (!page) { alert('Klik di dalam halaman dokumen dulu sebelum mengubah spasi baris.'); return; }
  const candidates = page.querySelectorAll('p, li, h1, h2, h3');
  let applied = false;
  candidates.forEach((c) => {
    if (range.intersectsNode(c)) { c.style.lineHeight = val; applied = true; }
  });
  if (!applied) {
    const node = range.startContainer;
    const el = node.nodeType === 3 ? node.parentElement : node;
    const block = el ? el.closest('p, li, h1, h2, h3') : null;
    if (block) { block.style.lineHeight = val; applied = true; }
  }
  if (!applied) { showToast('Klik langsung di dalam sebuah paragraf, lalu coba lagi.'); return; }
  lastFocusedPage = page;
  page.focus();
  showToast('Spasi baris diterapkan: ' + val);
});

  const savedRange = textCaseTracker.get();
  if (!savedRange) { alert('Blok teks dulu sebelum mengubah huruf.'); e.target.value = ''; return; }
  const span = document.createElement('span');
  const contents = savedRange.extractContents();
  span.appendChild(contents);
  let text = span.textContent;
  if (mode === 'upper') text = text.toUpperCase();
  else if (mode === 'lower') text = text.toLowerCase();
  else if (mode === 'title') text = text.replace(/\S+/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  span.textContent = text;
  savedRange.insertNode(span);
  const page = span.closest('.page');
  if (page) { lastFocusedPage = page; page.focus(); }
  const sel = window.getSelection();
  sel.removeAllRanges();
  const nr = document.createRange();
  nr.selectNodeContents(span);
  sel.addRange(nr);
  textCaseTracker.set(nr.cloneRange());
  e.target.value = '';
  updateWordCount();
});

// --- Sisipkan: Shapes (kotak, oval, panah, bintang, dll) ---
function shapeHtml(type) {
  const wrap = (inner, w, h) =>
    `<span class="shape-block" contenteditable="false" style="display:inline-block;width:${w}px;height:${h}px;vertical-align:middle;margin:4px;touch-action:none;cursor:move;">${inner}</span>`;
  switch (type) {
    case 'rect': return wrap(`<div style="width:100%;height:100%;border:2px solid #333;box-sizing:border-box;"></div>`, 110, 70);
    case 'roundrect': return wrap(`<div style="width:100%;height:100%;border:2px solid #333;border-radius:14px;box-sizing:border-box;"></div>`, 110, 70);
    case 'oval': return wrap(`<div style="width:100%;height:100%;border:2px solid #333;border-radius:50%;box-sizing:border-box;"></div>`, 90, 90);
    case 'triangle': return wrap(`<div style="width:0;height:0;border-left:45px solid transparent;border-right:45px solid transparent;border-bottom:78px solid #333;"></div>`, 90, 78);
    case 'diamond': return wrap(`<div style="width:64px;height:64px;border:2px solid #333;transform:rotate(45deg);margin:16px auto;box-sizing:border-box;"></div>`, 96, 96);
    case 'arrow-right': return wrap(`<svg viewBox="0 0 100 40" width="100%" height="100%"><line x1="5" y1="20" x2="80" y2="20" stroke="#333" stroke-width="5"/><polygon points="75,7 98,20 75,33" fill="#333"/></svg>`, 100, 40);
    case 'arrow-left': return wrap(`<svg viewBox="0 0 100 40" width="100%" height="100%"><line x1="20" y1="20" x2="95" y2="20" stroke="#333" stroke-width="5"/><polygon points="25,7 2,20 25,33" fill="#333"/></svg>`, 100, 40);
    case 'arrow-up': return wrap(`<svg viewBox="0 0 40 100" width="100%" height="100%"><line x1="20" y1="95" x2="20" y2="20" stroke="#333" stroke-width="5"/><polygon points="7,25 20,2 33,25" fill="#333"/></svg>`, 40, 100);
    case 'arrow-down': return wrap(`<svg viewBox="0 0 40 100" width="100%" height="100%"><line x1="20" y1="5" x2="20" y2="80" stroke="#333" stroke-width="5"/><polygon points="7,75 20,98 33,75" fill="#333"/></svg>`, 40, 100);
    case 'arrow-double': return wrap(`<svg viewBox="0 0 130 40" width="100%" height="100%"><line x1="20" y1="20" x2="110" y2="20" stroke="#333" stroke-width="5"/><polygon points="25,7 2,20 25,33" fill="#333"/><polygon points="105,7 128,20 105,33" fill="#333"/></svg>`, 130, 40);
    case 'star': return wrap(`<svg viewBox="0 0 100 100" width="100%" height="100%"><polygon points="50,5 61,38 96,38 68,59 79,92 50,71 21,92 32,59 4,38 39,38" fill="#333"/></svg>`, 90, 90);
    case 'callout': return wrap(`<div style="width:100%;height:100%;border:2px solid #333;border-radius:10px;box-sizing:border-box;"></div>`, 140, 80);
    case 'line': return wrap(`<div style="width:100%;height:2px;background:#333;margin-top:19px;"></div>`, 150, 40);
    case 'pentagon': return wrap(`<div style="width:100%;height:100%;background:#333;clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);"></div>`, 90, 86);
    case 'cross': return wrap(`<div style="position:relative;width:100%;height:100%;"><div style="position:absolute;left:40%;top:0;width:20%;height:100%;background:#333;"></div><div style="position:absolute;top:40%;left:0;width:100%;height:20%;background:#333;"></div></div>`, 90, 90);
    default: return '';
  }
}
document.getElementById('shapeSelect').addEventListener('change', (e) => {
  const type = e.target.value;
  if (!type) return;
  withFocusedPage(() => document.execCommand('insertHTML', false, shapeHtml(type) + '&nbsp;'));
  e.target.value = '';
});

// --- Sisipkan: Text Box ---
document.getElementById('textBoxBtn').addEventListener('click', () => {
  withFocusedPage(() => document.execCommand('insertHTML', false, '<span class="textbox" draggable="true" contenteditable="true">Ketik di sini...</span>&nbsp;'));
});

// --- Sisipkan: Header ---
document.getElementById('headerBtn').addEventListener('click', () => {
  const text = prompt('Isi teks header (akan muncul di atas setiap halaman):', '');
  if (text === null) return;
  document.querySelectorAll('.page-header-area').forEach(h => { h.textContent = text; });
  if (document.querySelectorAll('.page-header-area').length === 0) {
    getAllPages().forEach(p => {
      const header = document.createElement('div');
      header.className = 'page-header-area';
      header.contentEditable = 'true';
      header.textContent = text;
      p.insertBefore(header, p.firstChild);
    });
  }
  showToast('Header diterapkan ke semua halaman.');
});

// --- Sisipkan: Footer toggle (menampilkan/upadate teks footer custom) ---
document.getElementById('footerToggleBtn').addEventListener('click', () => {
  const text = prompt('Isi teks footer tambahan (akan muncul di bawah nomor halaman):', '');
  if (text === null) return;
  document.querySelectorAll('.page-footer').forEach((f) => {
    f.dataset.customText = text;
  });
  renumberPages();
  showToast('Footer diterapkan ke semua halaman.');
});

// --- Sisipkan: Page Number field (nomor halaman langsung di teks kursor) ---
document.getElementById('pageNumberInsertBtn').addEventListener('click', () => {
  withFocusedPage((page) => {
    const wrapper = page.closest('.page-wrapper');
    const label = wrapper ? wrapper.querySelector('.page-label') : null;
    const num = label ? label.textContent.replace(/\D/g, '') : '1';
    document.execCommand('insertText', false, num);
  });
});

// --- Sisipkan: Symbol ---
document.getElementById('symbolSelect').addEventListener('change', (e) => {
  const sym = e.target.value;
  if (!sym) return;
  withFocusedPage(() => document.execCommand('insertText', false, sym));
  e.target.value = '';
});

function updateWordCount() {
  const text = getAllPages().map(p => p.innerText).join(' ').trim();
  const count = text ? text.split(/\s+/).length : 0;
  const chars = text.length;
  wordCount.textContent = `${count} kata · ${chars} karakter`;
}

document.getElementById('newBtn').addEventListener('click', () => {
  if (confirm('Buat dokumen baru? Semua halaman saat ini akan dihapus.')) {
    commitNow();
    pageWrap.innerHTML = '';
    createPage('<p>Mulai ketik dokumen kamu di sini...</p>', null);
    commitNow();
    statusText.textContent = 'Dokumen Baru';
    updateWordCount();
  }
});

const fileInput = document.getElementById('fileInput');
document.getElementById('openBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const name = file.name.toLowerCase();
  try {
    let html;
    if (name.endsWith('.docx')) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      html = result.value;
    } else if (name.endsWith('.html') || name.endsWith('.htm')) {
      html = await file.text();
    } else {
      const text = await file.text();
      html = text.split(/\r?\n/).map(l => `<p>${l || '<br>'}</p>`).join('');
    }
    commitNow();
    pageWrap.innerHTML = '';
    createPage(html, null);
    commitNow();
    statusText.textContent = file.name;
    addRecentFile(file.name);
    updateWordCount();
    showToast('File berhasil dibuka: ' + file.name);
  } catch (err) {
    alert('Gagal membuka file: ' + err.message);
  }
  fileInput.value = '';
});

let savedFileHandle = null;
let autoSaveTimer = null;

function buildFullHtml(title) {
  const pages = getAllPages();

  // Pemisah halaman gaya "Save as Web Page" milik Word sendiri -- ini yang
  // benar-benar dikenali Word sebagai batas halaman keras, beda dengan cuma
  // menaruh CSS page-break-before pada sebuah <div> pembungkus (itu sering
  // diabaikan Word saat file dibuka, makanya semua halaman tergabung jadi satu).
  const MSO_PAGE_BREAK = "<br clear='all' style='mso-special-character:line-break;page-break-before:always'>";

  const bodyHtml = pages.map((p, i) => {
    const breakStyle = i > 0 ? "style='page-break-before:always;'" : '';
    const breakMarker = i > 0 ? MSO_PAGE_BREAK : '';
    return `${breakMarker}<div ${breakStyle}>${p.innerHTML}</div>`;
  }).join('');

  // --- Ukuran kertas & margin aktif, dikonversi ke cm untuk @page Word ---
  const paperSizeCm = { A4: { w: 21, h: 29.7 }, Letter: { w: 21.59, h: 27.94 }, Legal: { w: 21.59, h: 35.56 }, F4: { w: 21.5, h: 33 } };
  const paper = paperSizeCm[document.getElementById('paperSize').value] || paperSizeCm.A4;
  const marginUnit = document.getElementById('marginUnit').value;
  const toCm = (v) => { const n = parseFloat(v); if (isNaN(n)) return 2.54; return marginUnit === 'in' ? n * 2.54 : n; };
  const mTop = toCm(document.getElementById('marginTop').value);
  const mBottom = toCm(document.getElementById('marginBottom').value);
  const mLeft = toCm(document.getElementById('marginLeft').value);
  const mRight = toCm(document.getElementById('marginRight').value);

  return `<!DOCTYPE html>
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset='utf-8'>
<title>${title}</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
  <w:View>Print</w:View>
  <w:Zoom>100</w:Zoom>
  <w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page WordSection1 {
    size: ${paper.w}cm ${paper.h}cm;
    margin: ${mTop}cm ${mRight}cm ${mBottom}cm ${mLeft}cm;
    mso-header-margin: 0cm;
    mso-footer-margin: 0cm;
    mso-paper-source: 0;
  }
  div.WordSection1 { page: WordSection1; }
  body {
    font-family: 'Segoe UI', Calibri, Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.5;
    color: #111;
    margin: 0;
    text-align: left;
  }
  p, div, li, h1, h2, h3, td, th { text-align: left; }
  h1 { font-size: 24pt; font-weight: 600; margin: 0.6em 0 0.3em; }
  h2 { font-size: 18pt; font-weight: 600; margin: 0.6em 0 0.3em; }
  h3 { font-size: 14pt; font-weight: 600; margin: 0.6em 0 0.3em; }
  table { border-collapse: collapse; margin: 10px 0; }
  table td, table th { border: 1px solid #999; padding: 6px 10px; min-width: 60px; }
  img { max-width: 100%; }
</style>
</head>
<body>
<div class="WordSection1">${bodyHtml}</div>
</body>
</html>`;
}

async function performAutoSave() {
  if (!savedFileHandle) return;
  try {
    const title = savedFileHandle.name.replace(/\.docx?$/i, '');
    const fullHtml = buildFullHtml(title);
    const writable = await savedFileHandle.createWritable();
    await writable.write(new Blob(['\ufeff', fullHtml], { type: 'application/msword' }));
    await writable.close();
    statusText.textContent = savedFileHandle.name + ' (tersimpan otomatis)';
    showToast('✓ Tersimpan otomatis: ' + savedFileHandle.name);
  } catch (err) {
    // Handle might have been revoked/moved - stop trying until user saves again manually.
    savedFileHandle = null;
  }
}

function scheduleAutoSave() {
  if (!savedFileHandle) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(performAutoSave, 3000); // 3 detik setelah berhenti mengetik
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'Dokumen.doc',
        types: [{ description: 'Word Document', accept: { 'application/msword': ['.doc'] } }],
      });
      savedFileHandle = handle;
      const title = handle.name.replace(/\.docx?$/i, '');
      const fullHtml = buildFullHtml(title);
      const writable = await handle.createWritable();
      await writable.write(new Blob(['\ufeff', fullHtml], { type: 'application/msword' }));
      await writable.close();
      statusText.textContent = handle.name + ' (tersimpan — auto-save aktif)';
      addRecentFile(handle.name);
      showToast('Tersimpan! Auto-save aktif ke file ini selama kamu buka halaman ini.');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  const filename = prompt('Nama file? (browser kamu akan menyimpannya ke folder Downloads)', 'Dokumen') || 'Dokumen';
  const fullHtml = buildFullHtml(filename);
  const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/\.docx?$/i, '') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusText.textContent = filename + '.doc (tersimpan ke Downloads — auto-save tidak tersedia di browser ini)';
  addRecentFile(filename + '.doc');
  showToast('Tersimpan ke folder Downloads: ' + filename + '.doc');
});

// init
createPage('<p>Mulai ketik dokumen kamu di sini...</p>', null);
updateWordCount();
</script>
</body>
</html>
